  function renderPayroll(){
    const list = monthEntries(salaryMonth);
    const fees = computeTransportFees(list);
    const payableList = list.filter(e=>!e.paidOnSpot);

    const totalClasses = list.length;
    const totalTransport = payableList.reduce((s,e)=> s+(fees[e.id]||0), 0);
    const groupEntries = payableList.filter(e=>e.classType==='group');
    const avgAttendance = groupEntries.length ? (groupEntries.reduce((s,e)=>s+(Number(e.attendance)||0),0)/groupEntries.length) : 0;
    const bonusHit = groupEntries.filter(e=>targetBonusFor(e)>0).length;
    const bonusRate = groupEntries.length ? Math.round(bonusHit/groupEntries.length*100) : 0;

    const byTeacher = {};
    payableList.forEach(e=>{ byTeacher[e.teacher] = byTeacher[e.teacher] || []; byTeacher[e.teacher].push(e); });
    const teacherNames = Object.keys(byTeacher).sort();

    let grandTotal = 0;
    const subtotalByTeacher = {};
    teacherNames.forEach(name=>{
      let s=0;
      byTeacher[name].forEach(e=>{ s += baseFeeFor(e)+bonusFor(e)+(fees[e.id]||0); });
      subtotalByTeacher[name]=s;
      grandTotal += s;
    });

    // 第一次進入薪資總覽時自動展開第一位老師；之後依使用者的展開／收合狀態
    if(!payrollAutoExpandDone && expandedPayrollTeacher===null && teacherNames.length>0){
      expandedPayrollTeacher = teacherNames[0];
    }
    payrollAutoExpandDone = true;

    const blocks = teacherNames.map((name, idx)=>{
      const isOpen = expandedPayrollTeacher===name;
      const rows = byTeacher[name].sort(compareEntriesAsc);
      const rowOf = (e)=>{
        const base = baseFeeFor(e);
        const allow = allowanceFor(e);
        const target = targetBonusFor(e);
        const bonus = allow + target;
        const tFee = fees[e.id]||0;
        const sub = base+bonus+tFee;
        const manualEditable = isManualPriced(e.classType);
        const isEditingThis = editingManualId === e.id;
        // 車資欄同時顯示「出發地區」，地區、日期、人數等完整內容都改到旁邊的 ✎ 按鈕去編輯
        const feeText = tFee > 0
          ? tFee.toLocaleString() + (feeLabel(fees, e.id)==='出勤補貼' ? ' <span class="inline-note">補貼</span>' : '')
          : String(tFee||0);
        let transportCell;
        if(!courseHasTransport(e)){
          // 個別課／大師課的報價已含車資，地區不影響金額
          transportCell = `${feeText} <span class="inline-note no-print">報價已含</span>`;
        } else {
          transportCell = `<span style="display:inline-flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap;">
            ${feeText}
            <span class="inline-note">${escHtml(e.region||'—')}</span>
          </span>`;
        }
        let baseCell;
        if(!manualEditable){
          baseCell = base.toLocaleString();
        } else if(isEditingThis){
          baseCell = `<span style="display:inline-flex;gap:4px;align-items:center;justify-content:flex-end;">
            <input type="number" id="manual_${e.id}" style="width:80px;text-align:right;font-family:var(--font-mono);" value="${e.manualSalary??0}"
              onkeydown="if(event.key==='Enter'){App.saveManualSalary('${e.id}')}else if(event.key==='Escape'){App.cancelManualSalary()}"/>
            <button class="btn outline small" onclick="App.saveManualSalary('${e.id}')">存</button>
          </span>`;
        } else {
          // 鎖定顯示：金額 + 一支鉛筆按鈕，按了才能改
          baseCell = `<span style="display:inline-flex;gap:6px;align-items:center;justify-content:flex-end;">
            ${(Number(e.manualSalary)||0).toLocaleString()}
            <button class="btn outline small" title="修改個別課金額" onclick="App.startManualSalary('${e.id}')">✎</button>
          </span>`;
        }
        return { html:`
          <tr>
            <td>${fmtDate(e.date)}</td>
            <td>${escHtml(e.course)} ${subPill(e)}${originLine(e)}</td>
            <td class="num">${e.attendance ?? '-'}${isNoShow(e)?' <span class="pill muted">無人到課</span>':''}</td>
            <td class="num">${baseCell}</td>
            <td class="num">${allow>0 ? ('+'+allow.toLocaleString()) : '-'}</td>
            <td class="num">${target>0 ? ('+'+target.toLocaleString()) : '-'}</td>
            <td class="num">${transportCell}</td>
            <td class="num" id="rowsub-${e.id}" style="font-weight:600;">${sub.toLocaleString()}</td>
            <td>${e.note ? escHtml(e.note) : ''}</td>
            <td class="num no-print"><button class="btn outline small" title="修改這筆紀錄的完整內容（日期、地區、人數、課程等）" onclick="App.editEntryFromPayroll('${e.id}')">✎</button></td>
          </tr>`, sub };
      };
      // 依課程性質分區：依課程設定裡目前啟用中的類型順序，區內依日期遞增（rows 已排好）
      const TYPE_ORDER = activeCourseTypeKeys();
      const rowsHtml = TYPE_ORDER.map(type=>{
        const items = rows.filter(e=>e.classType===type);
        if(items.length===0) return '';
        let sectionSum = 0;
        const body = items.map(e=>{ const r = rowOf(e); sectionSum += r.sub; return r.html; }).join('');
        return `
          <tr class="detail-group-row"><td colspan="10">${typeLabel(type)}</td></tr>
          ${body}
          <tr class="detail-subtotal"><td colspan="7">${typeLabel(type)}小計</td><td class="num">$${sectionSum.toLocaleString()}</td><td></td><td class="no-print"></td></tr>`;

      // 明度依主題調整：深色後台用亮版、淺色前台用深版，文字對比才夠。
      const hue = teacherNames.length > 0 ? Math.round((idx / teacherNames.length) * 360) : 0;
      const accentHsl = (mode==='owner')
        ? `hsl(${hue} 48% 72%)`   // 深色後台：偏亮，對比 ≥5.7
        : `hsl(${hue} 60% 27%)`;  // 淺色前台：偏深，對比 ≥5.3
      return `
      <div class="card bar-card" data-teacher-card="${escAttr(name)}">
        <div class="name-bar teacher-tinted" style="cursor:pointer;--tint:${accentHsl};" onclick="App.togglePayrollExpand('${escJs(name)}')">
          <span class="name-bar-name" style="color:var(--tint);border-left:4px solid var(--tint);padding-left:10px;">${escHtml(name)}</span>
          <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
            <span class="info-hint">${rows.length} 堂</span>
            <span class="info-hint" style="font-family:var(--font-mono);font-weight:700;" id="barsub-${idx}">$${subtotalByTeacher[name].toLocaleString()}</span>
            <span class="expand-caret no-print" style="font-size:12px;color:var(--namebar-ink-soft);">${isOpen?'▲ 收合':'▼ 展開'}</span>
          </div>
        </div>
        <div class="card-body${isOpen?'':' collapsed'}" style="overflow-x:auto;">
          <table>
            <thead><tr><th>日期</th><th>課程</th><th class="num">人數</th><th class="num">基本薪資</th><th class="num">人數加給</th><th class="num">達標獎金</th><th class="num">車資</th><th class="num">小計</th><th>備註</th><th class="no-print"></th></tr></thead>
            <tbody>${rowsHtml}
            <tr class="subtotal"><td colspan="7">本月合計</td><td class="num" id="subtotal-${idx}">$${subtotalByTeacher[name].toLocaleString()}</td><td></td><td class="no-print"></td></tr>
            </tbody>
          </table>
        </div>
      </div>`;
    }).join('');

    return `
      <h2 class="section-title">${icon('payroll')}薪資總覽</h2>
      <ul class="note-list">
        ${(function(){
          const g = courseTypeByKey('group'), t = courseTypeByKey('trial');
          const lines = [];
          if(g && g.payModel==='tiered'){
            lines.push('<li><strong>'+escHtml(g.label)+'</strong>：基本薪資 $'+(Number(g.baseFee)||0).toLocaleString()+'／堂</li>');
            lines.push('<li><strong>人數加給</strong>（隨級距自動給）：'+tierText(g.headcountTiers||[])+'</li>');
            lines.push('<li><strong>達標獎金</strong>（另外計算）：'+tierText(g.targetBonusTiers||[])+'</li>');
          }
          if(t && t.payModel==='fixed'){
            lines.push('<li><strong>'+escHtml(t.label)+'</strong>：固定 $'+(Number(t.baseFee)||0).toLocaleString()+'，無加給與獎金</li>');
          }
          return lines.join('\n        ');
        })()}
        <li><strong>個別課</strong>：由您直接輸入金額，即時加總</li>
        <li><strong>無人到課</strong>（人數 0）：不計堂費，車馬費照給</li>
        <li>點下方長條圖可以跳到該位老師的區塊；想調整課程類型與費率，到「課程設定」頁面</li>
      </ul>
      <div class="card" style="max-width:260px;">
        <div class="field"><label>選擇月份</label>
          <input type="month" value="${salaryMonth}" onchange="App.setSalaryMonth(this.value)"/>
        </div>
      </div>
      ${totalClasses===0 ? `<div class="empty">這個月份還沒有任何登記紀錄。</div>` : `
      <div class="printable" id="payrollPrintArea">
      <div class="print-only print-letterhead">
        <div class="print-brand">BBS Studio</div>
        <div class="print-doctitle">薪資總覽</div>
        <div class="print-meta">${salaryMonth}　·　匯出於 ${printedAt()}</div>
      </div>
      <div class="kpi-grid">
        <div class="kpi-card"><div class="kpi-label">本月總堂數</div><div class="kpi-value">${totalClasses}</div></div>
        <div class="kpi-card"><div class="kpi-label">車資支出</div><div class="kpi-value">$${totalTransport.toLocaleString()}</div></div>
        <div class="kpi-card"><div class="kpi-label">常態課平均出席</div><div class="kpi-value">${avgAttendance.toFixed(1)}</div></div>
        <div class="kpi-card"><div class="kpi-label">達標獎金比例</div><div class="kpi-value">${bonusRate}%</div></div>
      </div>
      <div class="card no-print">
        <div class="card-title">${icon('payroll')}各老師薪資占比</div>

      </div>

      </div>

  function renderPayrollCharts(){
    if(typeof Chart === 'undefined') return;
    const allList = monthEntries(salaryMonth);
    if(allList.length===0) return;
    const fees = computeTransportFees(allList);
    const list = allList.filter(e=>!e.paidOnSpot);
    if(list.length===0) return;

    const byTeacher = {};
    list.forEach(e=>{ byTeacher[e.teacher] = (byTeacher[e.teacher]||0) + baseFeeFor(e)+bonusFor(e)+(fees[e.id]||0); });
    // 由高到低排，人多的時候一眼就看得出誰佔最大宗
    const teacherNames = Object.keys(byTeacher).sort((a,b)=>byTeacher[b]-byTeacher[a]);
    const teacherVals = teacherNames.map(n=>byTeacher[n]);

    const typeCounts = { group:0, trial:0, individual:0 };
    list.forEach(e=>{ typeCounts[e.classType] = (typeCounts[e.classType]||0)+1; });
    const typeKeys = ['group','trial','individual'];

    const courseAttendance = {};
    list.forEach(e=>{
      if(e.attendance!=null){
        courseAttendance[e.course] = courseAttendance[e.course] || [];
        courseAttendance[e.course].push(Number(e.attendance)||0);
      }
    });
    const courseNames = Object.keys(courseAttendance).sort((a,b)=>{
      const avgA = courseAttendance[a].reduce((s,v)=>s+v,0)/courseAttendance[a].length;
      const avgB = courseAttendance[b].reduce((s,v)=>s+v,0)/courseAttendance[b].length;
      return avgB - avgA;
    });
    const courseAvgVals = courseNames.map(c=>{
      const arr = courseAttendance[c];
      return Math.round((arr.reduce((s,v)=>s+v,0)/arr.length) * 10) / 10;
    });

    const cs = getComputedStyle(document.getElementById('app'));
    const accent = cs.getPropertyValue('--accent').trim() || '#8B3A3F';
    const accent2 = cs.getPropertyValue('--accent-2').trim() || '#8A7B4A';
    const success = cs.getPropertyValue('--success').trim() || '#4B6B4E';
    const ink = cs.getPropertyValue('--ink').trim() || '#2A2724';
    const inkSoft = cs.getPropertyValue('--ink-soft').trim() || '#78726A';
    const gridColor = cs.getPropertyValue('--border').trim() || '#E4DFD2';

    if(chartTeacherInst){ chartTeacherInst.destroy(); chartTeacherInst=null; }
    const teacherCtx = document.getElementById('chartTeacher');
    if(teacherCtx){
      // 長條顏色跟下方卡片用同一套色相公式（依老師在名單中的順序平均分佈色相），
      // 這樣圖表上的顏色跟捲動下去看到的卡片顏色是同一個人、同一種顏色，一眼就能對上。
      const teacherBarColors = teacherNames.map((_, i)=>{
        const hue = teacherNames.length > 0 ? Math.round((i / teacherNames.length) * 360) : 0;
        return `hsl(${hue} 48% 72%)`;
      });
      chartTeacherInst = new Chart(teacherCtx, {
        type:'bar',
        data:{ labels:teacherNames, datasets:[{ data:teacherVals, backgroundColor:teacherBarColors, borderRadius:5, maxBarThickness:26 }] },
        options:{
          // 橫向長條：老師人數多的時候名字才不會擠在一起或被轉成斜的
          indexAxis:'y',
          responsive:true, maintainAspectRatio:false,
          plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:(ctx)=> '$'+ctx.parsed.x.toLocaleString() } } },
          scales:{
            x:{ ticks:{ color:inkSoft, callback:(v)=> '$'+Number(v).toLocaleString() }, grid:{color:gridColor} },
            // autoSkip 預設會在空間不足時自動跳過刻度，導致只顯示一半的老師名字
            y:{ ticks:{ color:ink, autoSkip:false }, grid:{display:false} }
          },
          onClick:(evt, els)=>{ if(els.length===0) return; App.jumpToPayrollTeacher(teacherNames[els[0].index]); }
        }
      });
    }

    if(chartTypeInst){ chartTypeInst.destroy(); chartTypeInst=null; }
    const typeCtx = document.getElementById('chartType');
    if(typeCtx){
      chartTypeInst = new Chart(typeCtx, {
        type:'doughnut',
        data:{ labels:typeKeys.map(typeLabel), datasets:[{ data:typeKeys.map(k=>typeCounts[k]||0), backgroundColor:[accent, accent2, success], borderWidth:0 }] },
        options:{
          responsive:true, maintainAspectRatio:false,
          plugins:{ legend:{ position:'bottom', labels:{color:ink, boxWidth:12, padding:14, font:{size:11.5} } } }
        }
      });
    }

    if(chartCourseAvgInst){ chartCourseAvgInst.destroy(); chartCourseAvgInst=null; }
    const courseAvgCtx = document.getElementById('chartCourseAvg');
    if(courseAvgCtx){
      chartCourseAvgInst = new Chart(courseAvgCtx, {
        type:'bar',
        data:{ labels:courseNames, datasets:[{ data:courseAvgVals, backgroundColor:accent2, borderRadius:5, maxBarThickness:38 }] },
        options:{
          responsive:true, maintainAspectRatio:false,
          plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:(ctx)=> ctx.parsed.y+' 人' } } },
          scales:{ x:{ ticks:{color:inkSoft}, grid:{display:false} }, y:{ ticks:{color:inkSoft, precision:0}, grid:{color:gridColor}, beginAtZero:true } }
        }
      });
    }
  }

  // 老師薪資單的「資料」與「呈現方式」分開：這個函式只算數字，不管畫面長什麼樣子，
  // 這樣畫面上看到的（app 樣式）跟匯出的 PDF／圖片（紙本樣式）保證用同一份數字，不會兩邊對不上。
  function computeTeacherSlipData(name, monthAll, fees){
    const mainList = monthAll.filter(e=>e.teacher===name && !e.paidOnSpot).sort(compareEntriesAsc);
    const coveredList = monthAll.filter(e=>e.isSubstitute && e.originalTeacher===name).sort(compareEntriesAsc);

    const TYPE_ORDER = activeCourseTypeKeys();
    let total = 0;
    const sections = TYPE_ORDER.map(type=>{
      const items = mainList.filter(e=>e.classType===type);
      if(items.length===0) return null;
      const rows = items.map(e=>{
        const base=baseFeeFor(e), allow=allowanceFor(e), target=targetBonusFor(e), tFee=fees[e.id]||0;
        return { entry:e, base, allow, target, tFee, sub: base+allow+target+tFee };
      });
      const sectionSum = rows.reduce((s,r)=>s+r.sub, 0);
      total += sectionSum;
      return { type, rows, sectionSum };
    }).filter(Boolean);

    const allowanceHits = mainList.filter(e=>allowanceFor(e)>0);
    const bonusHits = mainList.filter(e=>targetBonusFor(e)>0);
    const allowanceSum = allowanceHits.reduce((s,e)=>s+allowanceFor(e), 0);
    const bonusSum = bonusHits.reduce((s,e)=>s+targetBonusFor(e), 0);

    return { name, sections, total, coveredList, allowanceHits, bonusHits, allowanceSum, bonusSum };
  }

  // 紙本樣式（給列印 PDF、另存圖片用）。維持原本的表格排版，是設計成要印在紙上／截成一張圖看的，
  // 欄位比較多、比較密，不追求手機上直接閱讀友善——手機上平常閱讀請看 buildTeacherAppCard()。
  function buildTeacherSlipDoc(data, fees){
    const { name, sections, total, coveredList } = data;

    const rowOf = (e)=>{
      const base = baseFeeFor(e); const allow = allowanceFor(e); const target = targetBonusFor(e);
      const tFee = fees[e.id]||0;
      const sub = base+allow+target+tFee;
      const subTag = e.isSubstitute
        ? `<br><span style="font-size:11.5px;color:var(--slip-ink-mid);">↳ 代 ${escHtml(e.originalTeacher||'')} 的班</span>`
        : '';
      const tFeeCell = `${tFee.toLocaleString()}${tFee>0 && feeLabel(fees,e.id)==='出勤補貼' ? '<br><span style="font-size:10px;color:var(--slip-ink-mid);">出勤補貼</span>' : ''}${courseHasTransport(e) && e.region ? `<br><span style="font-size:10px;color:var(--slip-ink-mid);">${escHtml(e.region)}</span>` : ''}`;
      return `<tr><td class="nw">${fmtDate(e.date)}</td><td>${escHtml(e.course)}${subTag}</td><td class="num">${e.attendance ?? '-'}</td><td class="num">${base.toLocaleString()}</td><td class="num">${allow>0?('+'+allow.toLocaleString()):'-'}</td><td class="num">${target>0?('+'+target.toLocaleString()):'-'}</td><td class="num nw">${tFeeCell}</td><td class="num">${sub.toLocaleString()}</td></tr>`;
    };

    const sectionsHtml = sections.map(sec=>`
        <tr class="slip-group-row"><td colspan="8">${typeLabel(sec.type)}</td></tr>
        ${sec.rows.map(r=>rowOf(r.entry)).join('')}
        <tr class="slip-subtotal"><td colspan="7">${typeLabel(sec.type)}小計</td><td class="num">$${sec.sectionSum.toLocaleString()}</td></tr>`).join('');

    const coveredRows = coveredList.map(e=>{
      const kind = subKindOf(e);
      const kindLabel = kind ? (kind==='internal' ? '內師' : '外師') : '';
      const status = e.paidOnSpot ? '當天現場已結清' : '計入代課老師本人薪資';
      return `<tr><td class="nw">${fmtDate(e.date)}</td><td>${escHtml(e.course)}</td><td class="num">${e.attendance ?? '-'}</td><td class="nw">${escHtml(e.teacher)}${kindLabel?`<span style="color:var(--slip-ink-mid);font-size:11.5px;">（${kindLabel}）</span>`:''}</td><td class="nw" style="color:var(--slip-ink-mid);">${status}</td></tr>`;
    }).join('');

    const remarkItems = [];
    if(data.allowanceHits.length){
      remarkItems.push(
        '本月共 <strong>' + data.allowanceHits.length + '</strong> 堂達到人數加給，合計 <strong>$' + data.allowanceSum.toLocaleString() + '</strong>。'
        + '（詳細級距請見「課程設定」）'
      );
    }
    if(data.bonusHits.length){
      remarkItems.push(
        '本月共 <strong>' + data.bonusHits.length + '</strong> 堂達到達標獎金，合計 <strong>$' + data.bonusSum.toLocaleString() + '</strong>。'
        + '（詳細級距請見「課程設定」）'
      );
    }
    const remarkBlock = remarkItems.length ? `
      <div class="slip-section">
        <div class="slip-section-title">備註</div>
        <ul style="margin:0;padding-left:18px;font-size:12.5px;line-height:1.9;">
          ${remarkItems.map(t=>`<li>${t}</li>`).join('')}
          <li style="color:var(--slip-ink-mid);">常態課基本薪資為每堂 $${(Number((courseTypeByKey('group')||{}).baseFee)||0).toLocaleString()}，人數超過級距的部分列於「人數加給」，達到門檻另計「達標獎金」。</li>
        </ul>
      </div>` : '';

    return `
      <div class="print-brand">BBS Studio</div>
      <h2>薪資結算單</h2>
      <div class="meta"><span>老師：${escHtml(name)}</span><span>月份：${payslipMonth}</span></div>
      <table>
        <thead><tr><th>日期</th><th>課程</th><th class="num">人數</th><th class="num">基本薪資</th><th class="num">人數加給</th><th class="num">達標獎金</th><th class="num">車資</th><th class="num">小計</th></tr></thead>
        <tbody>${sectionsHtml || `<tr><td colspan="8" style="color:var(--slip-ink-soft);">本月無自行授課紀錄</td></tr>`}
        <tr class="total-row"><td colspan="7">本人薪資合計</td><td class="num">$${total.toLocaleString()}</td></tr>
        </tbody>
      </table>
      ${coveredRows ? `
      <div class="slip-section">
        <div class="slip-section-title">本月由他人代課的原排課紀錄（僅供對照，不計入本人薪資）</div>
        <table style="font-size:12.5px;">
          <thead><tr><th>日期</th><th>課程</th><th class="num">人數</th><th>代課老師</th><th>狀態</th></tr></thead>
          <tbody>${coveredRows}</tbody>
        </table>
      </div>` : ''}
      ${remarkBlock}
      <div class="print-only print-footer">BBS Studio 營運與薪資管理系統・內部薪資文件，僅供對帳使用・匯出於 ${printedAt()}</div>
    `;
  }

  // app 樣式（一般畫面顯示用）。跟系統其他頁面同一套視覺語言：卡片、彈性排版、不用固定欄位的表格，
  // 手機上不會因為欄位太多被擠爆——這是每天用手機看薪資時真正會看的版面。
  function buildTeacherAppCard(data, fees, toneNum){
    const { name, sections, total, coveredList } = data;
    const rowLine = (e)=>{
      const base = baseFeeFor(e); const allow = allowanceFor(e); const target = targetBonusFor(e);
      const tFee = fees[e.id]||0;
      const sub = base+allow+target+tFee;
      const bits = [`基本 $${base.toLocaleString()}`];
      if(allow>0) bits.push(`人數加給 +$${allow.toLocaleString()}`);
      if(target>0) bits.push(`達標獎金 +$${target.toLocaleString()}`);
      if(courseHasTransport(e)) bits.push(`車資 $${tFee.toLocaleString()}${e.region?'（'+escHtml(e.region)+'）':''}`);
      const subTag = e.isSubstitute ? `<span class="inline-note" style="margin-left:6px;">↳ 代 ${escHtml(e.originalTeacher||'')}</span>` : '';
      return `
        <div class="slip-app-row">
          <div class="slip-app-row-top">
            <span class="nw">${fmtDate(e.date)}</span>
            <span class="slip-app-course">${escHtml(e.course)}${subTag}</span>
            <span class="num slip-app-sub">$${sub.toLocaleString()}</span>
          </div>
          <div class="slip-app-row-bits">人數 ${e.attendance ?? '-'}　·　${bits.join('　·　')}</div>
        </div>`;
    };
    const sectionsHtml = sections.map(sec=>`
        <div class="slip-app-section-title">${typeLabel(sec.type)}<span class="inline-note" style="margin-left:8px;">小計 $${sec.sectionSum.toLocaleString()}</span></div>
        ${sec.rows.map(r=>rowLine(r.entry)).join('')}
    `).join('');
    const coveredHtml = coveredList.length ? `
      <div class="slip-app-section-title" style="margin-top:16px;">本月由他人代課（僅供對照，不計入本人薪資）</div>
      ${coveredList.map(e=>{
        const kind = subKindOf(e);
        const kindLabel = kind ? (kind==='internal'?'內師':'外師') : '';
        const status = e.paidOnSpot ? '當天現場已結清' : '計入代課老師本人薪資';
        return `<div class="slip-app-row"><div class="slip-app-row-top"><span class="nw">${fmtDate(e.date)}</span><span class="slip-app-course">${escHtml(e.course)}</span></div>
          <div class="slip-app-row-bits">人數 ${e.attendance ?? '-'}　·　${escHtml(e.teacher)}${kindLabel?'（'+kindLabel+'）':''}　·　${status}</div></div>`;
      }).join('')}` : '';

    return `
      <div class="card bar-card teacher-toned slip-card" style="--tint:var(--tone-${toneNum});">
        <div class="card-title" style="color:var(--tint);">${icon('payslip')}${escHtml(name)}　<span class="inline-note" style="font-weight:400;">${payslipMonth}</span></div>
        ${sectionsHtml || `<p class="empty" style="margin:10px 0;">本月無自行授課紀錄</p>`}
        <div class="staff-total-row grand" style="margin-top:6px;"><span>${escHtml(name)} 本人薪資合計</span><span class="num">$${total.toLocaleString()}</span></div>
        ${coveredHtml}
      </div>`;
  }

  function renderPayslipTab(){
    const monthAll = monthEntries(payslipMonth);
    const fees = computeTransportFees(monthAll);

    const directNames = monthAll.filter(e=>!e.isSubstitute).map(e=>e.teacher);
    const actingSubNames = monthAll.filter(e=>e.isSubstitute && !e.paidOnSpot).map(e=>e.teacher);
    const coveredNames = monthAll.filter(e=>e.isSubstitute && e.originalTeacher).map(e=>e.originalTeacher);
    const names = [...new Set([...directNames, ...actingSubNames, ...coveredNames])].sort();
    const namesForAll = [...new Set(monthAll.filter(e=>!e.paidOnSpot).map(e=>e.teacher))].sort();

    const isAll = payslipTeacher === ALL_TEACHERS;
    let appHtml = '';       // 平常畫面上看到的（app 樣式，手機安全）
    let exportDocs = '';    // 藏在畫面外、專門給列印／另存圖片用的紙本樣式
    let actionBtns = '';

    if(isAll){
      if(namesForAll.length===0){
        appHtml = `<div class="empty">這個月份還沒有任何老師的授課紀錄。</div>`;
      }else{
        appHtml = namesForAll.map((n, i)=>{
          const data = computeTeacherSlipData(n, monthAll, fees);
          return buildTeacherAppCard(data, fees, (i % 5) + 1);
        }).join('');
        exportDocs = namesForAll.map((n, idx)=>{
          const data = computeTeacherSlipData(n, monthAll, fees);
          return `<div class="payslip" style="${idx>0?'page-break-before:always;margin-top:0;':''}">${buildTeacherSlipDoc(data, fees)}</div>`;
        }).join('');
        actionBtns = `<button class="btn" onclick="App.printSlip()">另存 PDF（共 ${namesForAll.length} 位老師）</button>`;
      }
    } else if(payslipTeacher && names.includes(payslipTeacher)){
      const data = computeTeacherSlipData(payslipTeacher, monthAll, fees);
      appHtml = buildTeacherAppCard(data, fees, 1);
      exportDocs = `<div class="payslip">${buildTeacherSlipDoc(data, fees)}</div>`;
      actionBtns = `
        <button class="btn" onclick="App.printSlip()">另存 PDF</button>
        <button class="btn outline" onclick="App.saveSlipImage(this)">另存圖片</button>`;
    }

    return `
      <h2 class="section-title">${icon('payslip')}老師薪資</h2>
      <ul class="note-list">
        <li>選好月份與老師，下面會直接顯示薪資明細；要留存或傳給老師時再按「另存 PDF」或「另存圖片」</li>
        <li>老師選「<strong>本月全部老師</strong>」可一次輸出全部 PDF，每位各自一頁；圖片僅支援單一老師</li>
        <li>已代課即付的紀錄不在這裡，請看「代課即付紀錄」</li>
        <li>老師的課被別人代掉時，薪資單下方會列出參考紀錄，不計入本人薪資</li>
      </ul>
      <div class="card no-print">
        <div class="grid2">
          <div class="field"><label>月份</label><input type="month" value="${payslipMonth}" onchange="App.setPayslipMonth(this.value)"/></div>
          <div class="field"><label>老師</label>
            <select onchange="App.setPayslipTeacher(this.value)">
              <option value="">請選擇</option>
              <option value="${ALL_TEACHERS}" ${isAll?'selected':''}>── 本月全部老師（${namesForAll.length} 位）──</option>
              ${names.map(n=>`<option value="${escAttr(n)}" ${n===payslipTeacher?'selected':''}>${escHtml(n)}</option>`).join('')}
            </select>
          </div>
        </div>
        ${actionBtns ? `<div style="display:flex;gap:8px;flex-wrap:wrap;">${actionBtns}</div>` : ''}
      </div>
      <div class="no-print">${appHtml}</div>
      ${exportDocs ? `<div id="printArea" class="printable export-doc">${exportDocs}</div>` : ''}
    `;
  }

  function renderPaidOnSpotTab(){
    const monthAll = monthEntries(payslipMonth);
    const fees = computeTransportFees(monthAll);
    const paidList = monthAll.filter(e=>e.paidOnSpot).sort(compareEntriesAsc);
    let total = 0;
    const rows = paidList.map(e=>{
      const base = baseFeeFor(e); const bonus = bonusFor(e); const tFee = fees[e.id]||0; const sub = base+bonus+tFee;
      total += sub;
      const kind = subKindOf(e);
      const kindLabel = kind ? (kind==='internal' ? '內師' : '外師') : '';
      return `<tr><td class="nw">${fmtDate(e.date)}</td><td class="nw">${escHtml(e.originalTeacher||'-')}</td><td class="nw">${escHtml(e.teacher)}${kindLabel?`<span style="color:var(--slip-ink-mid);font-size:11.5px;">（${kindLabel}）</span>`:''}</td><td>${escHtml(e.course)}</td><td class="nw">${typeLabel(e.classType)}</td><td class="num">${e.attendance ?? '-'}</td><td class="num">${sub.toLocaleString()}</td></tr>`;
    }).join('');

    // 一般畫面顯示：跟老師薪資同一套彈性列樣式，手機上不會被 7 欄的表格擠爆
    const appRows = paidList.map(e=>{
      const base = baseFeeFor(e); const bonus = bonusFor(e); const tFee = fees[e.id]||0; const sub = base+bonus+tFee;
      const kind = subKindOf(e);
      const kindLabel = kind ? (kind==='internal' ? '內師' : '外師') : '';
      return `
        <div class="slip-app-row">
          <div class="slip-app-row-top">
            <span class="nw">${fmtDate(e.date)}</span>
            <span class="slip-app-course">${escHtml(e.course)}</span>
            <span class="num slip-app-sub">$${sub.toLocaleString()}</span>
          </div>
          <div class="slip-app-row-bits">${escHtml(e.originalTeacher||'-')} → ${escHtml(e.teacher)}${kindLabel?'（'+kindLabel+'）':''}　·　${typeLabel(e.classType)}　·　人數 ${e.attendance ?? '-'}</div>
        </div>`;
    }).join('');

    return `
      <h2 class="section-title">${icon('billing')}代課紀錄</h2>
      <p class="section-sub">本月所有已經當天現場付清的代課費用，純供對帳與留存紀錄，不屬於任何一位老師的月結薪資。</p>
      <div class="card no-print">
        <div class="field" style="max-width:220px;"><label>月份</label><input type="month" value="${payslipMonth}" onchange="App.setPayslipMonth(this.value)"/></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn" onclick="App.printSlip()">另存 PDF</button>
          ${paidList.length>0 ? `<button class="btn outline" onclick="App.savePaidOnSpotImage(this)">另存圖片</button>` : ''}
        </div>
      </div>
      <div class="card no-print">
        <div class="card-title">${icon('billing')}${payslipMonth}　<span class="inline-note" style="font-weight:400;">共 ${paidList.length} 筆・總額 $${total.toLocaleString()}</span></div>
        ${appRows || `<p class="empty" style="margin:10px 0;">本月無代課即付紀錄</p>`}
      </div>
      <div id="paidOnSpotPrintArea" class="printable export-doc">
        <div class="payslip">
          <div class="print-brand">BBS Studio</div>
          <h2>代課即付紀錄</h2>
          <div class="meta"><span>月份：${payslipMonth}</span><span>共 ${paidList.length} 筆</span></div>
          <table>
            <thead><tr><th>日期</th><th>原排定老師</th><th>代課老師</th><th>課程</th><th>性質</th><th class="num">人數</th><th class="num">已支付金額</th></tr></thead>
            <tbody>${rows || `<tr><td colspan="7" style="color:var(--slip-ink-soft);">本月無代課即付紀錄</td></tr>`}
            <tr class="total-row"><td colspan="6">本月總計</td><td class="num">$${total.toLocaleString()}</td></tr>
            </tbody>
          </table>
          <div class="print-only print-footer">BBS Studio 營運與薪資管理系統・內部薪資文件，僅供對帳使用・匯出於 ${printedAt()}</div>
        </div>
      </div>
    `;
  }

  // ---------- 員工薪資（後台） ----------
  function renderHourlyTab(){
    const list = monthShifts(shiftMonth)
      .filter(sh=> !shiftFilterStaff || sh.staff===shiftFilterStaff)
      .sort(compareShiftsAsc);

    const byStaff = {};
    list.forEach(sh=>{ (byStaff[sh.staff] = byStaff[sh.staff] || []).push(sh); });
    const names = Object.keys(byStaff).sort((a,b)=>a.localeCompare(b,'zh-Hant'));

    const grandMins = list.reduce((a,sh)=>a+shiftMinutes(sh),0);
    const grandBasePay = list.reduce((a,sh)=>a+shiftPay(sh),0);
    // 只計算「本月有出現在名單中」的員工獎金，跟篩選條件一致
    const grandBonus = names.reduce((a,n)=> a + bonusTotalFor(n, shiftMonth), 0);
    const grandPay  = grandBasePay + grandBonus;
    const pool = staffPool();

    return `
      <h2 class="section-title">${icon('clock')}員工薪資</h2>
      <ul class="note-list">
        <li>依<strong>打卡紀錄</strong>自動計算每位員工的工時與工資</li>
        <li>時薪設定已搬到「系統設定」頁，需要調整請到那邊；<strong>只有經營者／系統管理者能開</strong></li>
        <li>各員工用不同顏色的色條區分，月結獎金可個別新增</li>
      </ul>

      <div class="card no-print">
        <div class="card-title">${icon('clock')}代員工登記工時</div>
        <p class="inline-note" style="margin-bottom:12px;">員工忘記打卡、或需要補登以前的班別時，可以在這裡直接幫他們新增，不用切換到前台。</p>
        <div class="grid3">
          <div class="field"><label>員工姓名</label>
            <input type="text" id="a_staff" list="staffListForAdd" placeholder="請輸入或選擇姓名"/>
            <datalist id="staffListForAdd">${pool.map(n=>`<option value="${escAttr(n)}">${escAttr(displayNameOf(n))}</option>`).join('')}</datalist>
          </div>
          <div class="field"><label>日期</label>
            <input type="date" id="a_date" value="${new Date().toISOString().slice(0,10)}" max="${new Date().toISOString().slice(0,10)}" onchange="App.syncDayNote('a_date','a_dayNote')"/>
            <div class="inline-note" id="a_dayNote">${dayLabel(new Date().toISOString().slice(0,10))}</div>
          </div>
          <div class="field"><label>備註（可留空）</label>
            <input type="text" id="a_note" placeholder="例如：補登、代班"/>
          </div>
        </div>
        <div class="grid3">
          <div class="field"><label>上班時間</label>
            <div class="time-picker">
              <select id="a_startH" onchange="App.previewAdminShift()">${hourOptions('')}</select>
              <span class="time-colon">:</span>
              <select id="a_startM" onchange="App.previewAdminShift()">${minuteOptions('')}</select>
            </div>
          </div>
          <div class="field"><label>下班時間</label>
            <div class="time-picker">
              <select id="a_endH" onchange="App.previewAdminShift()">${hourOptions('')}</select>
              <span class="time-colon">:</span>
              <select id="a_endM" onchange="App.previewAdminShift()">${minuteOptions('')}</select>
            </div>
          </div>
        </div>
        <div id="adminShiftPreview" class="inline-note" style="margin:4px 0 12px;font-weight:600;color:var(--accent);"></div>
        <button class="btn" onclick="App.addShiftAsAdmin()">新增這筆工時</button>
      </div>


      <div class="card no-print">
        <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;">
          <div class="field" style="margin-bottom:0;max-width:180px;"><label>月份</label>
            <input type="month" value="${shiftMonth}" onchange="App.setShiftMonth(this.value)"/>
          </div>
          <div class="field" style="margin-bottom:0;max-width:200px;"><label>篩選員工</label>
            <select onchange="App.setShiftFilterStaff(this.value)">
              <option value="">全部員工</option>
              ${(function(){
                // 跟系統設定的帳號管理清單一致；如果目前篩選的是已停用或歷史名字，
                // 還是把它留在選單裡（並標註），不然選單會突然看起來像篩選失效了。
                const opts = activeStaffNames();
                if(shiftFilterStaff && !opts.includes(shiftFilterStaff)) opts.push(shiftFilterStaff);
                opts.sort(compareNames);
                return opts.map(n=>{
                  const isHistorical = !activeStaffNames().includes(n);
                  return `<option value="${escAttr(n)}" ${shiftFilterStaff===n?'selected':''}>${escHtml(displayNameOf(n))}${isHistorical?'（歷史／已停用）':''}</option>`;
                }).join('');
              })()}
            </select>
          </div>
          <button class="btn outline small" onclick="App.printHourly()">列印 / 存成 PDF</button>
        </div>
      </div>

      <div class="printable" id="hourlyPrintArea">
      <div class="print-only print-letterhead">
        <div class="print-brand">BBS Studio</div>
        <div class="print-doctitle">員工薪資</div>
        <div class="print-meta">${shiftMonth}${shiftFilterStaff?('　·　'+escHtml(displayNameOf(shiftFilterStaff))+' 個人薪資'):''}　·　匯出於 ${printedAt()}</div>
      </div>
      <div class="summary-band${shiftFilterStaff ? ' no-print' : ''}">
        <div class="summary-title">${shiftMonth} 全員合計</div>
        <div class="summary-grid">
          <div class="summary-item"><div class="summary-label">總時數</div><div class="summary-value">${minutesToHhmm(grandMins)}</div></div>
          <div class="summary-item"><div class="summary-label">總班數</div><div class="summary-value">${list.length} 班</div></div>
          <div class="summary-item"><div class="summary-label">工時工資</div><div class="summary-value">$${grandBasePay.toLocaleString()}</div></div>
          <div class="summary-item"><div class="summary-label">獎金</div><div class="summary-value">${grandBonus>0?('+$'+grandBonus.toLocaleString()):'—'}</div></div>
          <div class="summary-item total"><div class="summary-label">應付總額</div><div class="summary-value">$${grandPay.toLocaleString()}</div></div>
        </div>
      </div>

      <div class="staff-section-label">各員工明細</div>

      ${names.length===0 ? `<div class="card"><div class="empty">這個月份還沒有打卡紀錄</div></div>` : (function(){
        // 色號依「全體員工名單」裡的固定順序分配，不是這個月篩選後才排的順序，
        // 這樣同一個人不管換月份看、或篩選成只看他一個人，顏色永遠是同一個，不會亂跳。
        const allStaffOrder = staffPool();
        return names.map((name)=>{
        const idx = allStaffOrder.indexOf(name);
        const toneNum = idx >= 0 ? (idx % 5) + 1 : 1;
        const rows = byStaff[name];
        const mins = rows.reduce((a,sh)=>a+shiftMinutes(sh),0);
        const pay  = rows.reduce((a,sh)=>a+shiftPay(sh),0);
        const myBonuses = bonusesFor(name, shiftMonth);
        const bonusSum = myBonuses.reduce((a,b)=>a+(Number(b.amount)||0),0);
        const finalPay = pay + bonusSum;
        return `
        <div class="card staff-card tone-${toneNum}">
          <div class="card-title">${icon('teacher')}${staffLabel(name)}　<span class="inline-note" style="font-weight:400;">時薪 $${hourlyRateFor(name).toLocaleString()}／小時</span></div>
          <div class="table-scroll">
          <table>
            <thead><tr><th>日期</th><th>上班</th><th>下班</th><th class="num">時數</th><th class="num">適用時薪</th><th class="num">工資</th><th>備註</th></tr></thead>
            <tbody>
            ${rows.map(sh=>{
              const overnight = (timeToMinutes(sh.end)!==null && timeToMinutes(sh.start)!==null && timeToMinutes(sh.end)<timeToMinutes(sh.start));
              const usedRate = (sh.rateOverride!==null && sh.rateOverride!==undefined && Number(sh.rateOverride)>0) ? Number(sh.rateOverride) : hourlyRateFor(sh.staff);
              return `
              <tr>

  function renderRegionSyncPreview(){
    const p = regionSyncPlan;
    const unmatchedNames = Object.keys(p.unmatched);
    const diff = p.feeAfter - p.feeBefore;
    const rangeText = (p.fromYm || p.toYm)
      ? ((p.fromYm||'最早') + ' ～ ' + (p.toYm||'最新'))
      : '全部月份';

    if(p.changes.length === 0){
      return `
      <div class="callout-box" style="margin-top:12px;">
        <div class="callout-box-title">✓ 沒有需要校正的紀錄</div>
        <div style="font-size:12.5px;line-height:1.7;">
          範圍：${escHtml(rangeText)}，掃描 ${p.scanned} 筆紀錄，地區都已經跟老師目前的設定一致。
          ${unmatchedNames.length ? '<br/>另有 ' + unmatchedNames.length + ' 位老師在教師設定中找不到（' + escHtml(unmatchedNames.join('、')) + '），這些紀錄沒有被檢查。' : ''}
        </div>
      </div>`;
    }

    const rows = p.changes.map(g=>`
      <tr>
        <td>${escHtml(g.teacher)}</td>
        <td>${fmtDate(g.date)}</td>
        <td class="center">${g.items.length}</td>
        <td>${escHtml(g.from)} → <strong>${escHtml(g.to)}</strong></td>
        <td class="num">$${g.feeBefore.toLocaleString()} → $${g.feeAfter.toLocaleString()}</td>
      </tr>`).join('');

    return `
      <div class="info-divider"></div>
      <div class="info-label">預覽結果（尚未寫入）</div>
      <div class="callout-box" style="margin:10px 0;">
        <div style="font-size:12.5px;line-height:1.8;">
          範圍：<strong>${escHtml(rangeText)}</strong>，掃描 ${p.scanned} 筆<br/>
          要修改：<strong>${p.changes.length}</strong> 個「老師×日期」，共 <strong>${p.entryCount}</strong> 筆紀錄<br/>
          車資總額：$${p.feeBefore.toLocaleString()} →
          <strong>$${p.feeAfter.toLocaleString()}</strong>
          <span style="color:${diff>0?'var(--danger)':'var(--success)'};">
            （${diff>0?'+':''}$${diff.toLocaleString()}）</span>
          ${unmatchedNames.length ? '<br/><span style="color:var(--danger);">⚠ 找不到這些老師的設定，其紀錄未納入：' + escHtml(unmatchedNames.join('、')) + '</span>' : ''}
        </div>
      </div>
      <div style="overflow-x:auto;max-height:340px;overflow-y:auto;">
        <table>
          <thead><tr><th>老師</th><th>日期</th><th class="center">筆數</th><th>地區</th><th class="num">車資</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;">
        <button class="btn danger" onclick="App.applyRegionSync()">確認套用這 ${p.entryCount} 筆</button>
        <button class="btn outline" onclick="App.clearRegionSyncPreview()">取消</button>
      </div>`;
  }

  function renderAuditLogCard(){
    const whoOptions = [...new Set(auditLog.map(l=>l.who).filter(Boolean))].sort();

      .filter(l=> !auditFilterDate || (l.at||'').slice(0,10)===auditFilterDate)

      .slice().reverse();   // 最新的在最上面
    const totalPages = Math.max(1, Math.ceil(matched.length / AUDIT_PER_PAGE));
    if(auditPage > totalPages) auditPage = totalPages;
    if(auditPage < 1) auditPage = 1;
    const start = (auditPage-1)*AUDIT_PER_PAGE;
    const pageRows = matched.slice(start, start+AUDIT_PER_PAGE);
    const hasFilter = !!(auditFilterDate || auditFilterWho);

    const fmtAt = (iso)=>{
      if(!iso) return '';
      const d = new Date(iso);
      const p = n=>String(n).padStart(2,'0');
      return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    };
    const rows = pageRows.map(l=>`
      <tr>
        <td class="nw">${fmtAt(l.at)}</td>
        <td class="nw">${escHtml(displayNameOf(l.who))}</td>
        <td class="nw">${escHtml(l.action)}</td>
        <td>${escHtml(l.target)}</td>
        <td>${l.detail ? escHtml(l.detail) : '<span class="inline-note">—</span>'}</td>
      </tr>`).join('');

    return `
      <div class="card bar-card">

              <option value="">全部</option>

        <div style="overflow-x:auto;">
          <table>
            <thead><tr><th>時間</th><th>操作人</th><th>動作</th><th>對象</th><th>變更內容</th></tr></thead>

  function escHtml(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function escAttr(s){ return escHtml(s); }
  // 要塞進 onclick="...('這裡')" 的字串：先做 JS 跳脫，再做 HTML 跳脫，
  // 名字裡有單引號或反斜線時才不會把整段 handler 弄壞
  function escJs(s){ return escHtml(String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")); }


  // 另存圖片共用邏輯：把藏在畫面外的紙本樣式文件截成一張 PNG。
  // selector 抓的是 .export-doc 容器裡的 .payslip 節點，node 雖然在畫面外，
  // 但仍有真實版面配置，html2canvas 照樣抓得到。
  async function exportPayslipImage(selector, filename, btn){
    if(typeof html2canvas === 'undefined'){
      alert('圖片功能的元件還在載入，請稍等一秒再試一次。'); return;
    }
    const node = document.querySelector(selector);
    if(!node){ alert('找不到可以截圖的內容，請確認資料已經選好。'); return; }
    const oldText = btn ? btn.textContent : '';
    if(btn){ btn.disabled = true; btn.textContent = '產生圖片中…'; }

    // html2canvas 對「定位在畫面外很遠」的元素偶爾抓不準，保險起見截圖前
    // 暫時把外層容器移回正常位置（頁面上還是看不到，因為緊接在後面馬上疊圖層蓋掉：用 z-index:-1 遮住），
    // 截圖完成立刻恢復，使用者感覺不到任何畫面變化。
    const wrap = node.closest('.export-doc');
    const prevCss = wrap ? wrap.style.cssText : '';
    if(wrap){
      wrap.style.position = 'fixed';
      wrap.style.left = '0';
      wrap.style.top = '0';
      wrap.style.zIndex = '-1';
      wrap.style.visibility = 'visible';
    }
    try{
      const canvas = await html2canvas(node, {
        backgroundColor: '#FFFFFF',
        scale: 2,              // 放大兩倍擷取，圖片文字才不會糊
        useCORS: true
      });
      const url = canvas.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }catch(e){
      alert('產生圖片失敗，請改用「另存 PDF」。\n\n('+(e&&e.message||e)+')');
    }
    if(wrap){ wrap.style.cssText = prevCss; }
    if(btn){ btn.disabled = false; btn.textContent = oldText || '另存圖片'; }
  }

    addShift(){
      // 沒有代管權限的人姓名欄是鎖住的，直接以登入帳號為準，避免讀到空值
      const staff = canManageOthers()
        ? ((document.getElementById('s_staff').value||'').trim())
        : currentUser.username;
      const date = document.getElementById('s_date').value;
      const start = readTimeFrom('s_startH','s_startM');
      const end = readTimeFrom('s_endH','s_endM');
      const note = (document.getElementById('s_note').value||'').trim();

      if(!staff || !date || !start || !end){ alert('請填寫姓名、日期、上班時間與下班時間（時與分都要選）。'); return; }
      // 櫃檯只能幫自己登記；主管以上可以代為登記其他人
      if(!canManageOthers() && staff!==currentUser.username){
        alert('只能登記自己的時數。');
        return;
      }
      if(date > new Date().toISOString().slice(0,10)){ alert('日期不能晚於今天，請確認日期是否選錯。'); return; }

      const tmp = { start, end, staff, rateOverride:null };
      const mins = shiftMinutes(tmp);
      if(mins <= 0){ alert('計算後的工時是 0，請確認上下班時間是否填錯。'); return; }
      if(mins > 16*60){
        if(!confirm('這筆工時超過 16 小時（' + minutesToHhmm(mins) + '），確定時間沒有填錯嗎？')) return;
      }

      // 同一人同一天重複登記時提醒，避免手滑重複打卡
      const dup = shifts.find(x=> x.staff===staff && x.date===date && x.id!==editingShiftId);
      if(dup && !editingShiftId){
        if(!confirm(staff + ' 在 ' + date + ' 已經有一筆打卡紀錄了（' + dup.start + '–' + dup.end + '），確定要再新增一筆嗎？')) return;
      }

      const payload = { staff, date, start, end, note,
        updatedBy: currentUser.username, updatedAt: new Date().toISOString() };

      const confirmMsg = '請確認這筆打卡紀錄：\n\n姓名：'+staff+'\n日期：'+date+'\n上班：'+start+'　下班：'+end
        + '\n工時：'+minutesToHhmm(mins)+'　預估工資：$'+shiftPay(Object.assign({rateOverride:null}, payload)).toLocaleString()
        + '\n\n確定要送出嗎？';
      if(!confirm(confirmMsg)) return;

      if(editingShiftId){
        const sh = shifts.find(x=>x.id===editingShiftId);
        if(sh){
          const before = Object.assign({}, sh);
          Object.assign(sh, payload);
          if(!('rateOverride' in sh)) sh.rateOverride = null;
          markChanged(sh.id);
          const changes = diffText(before, sh, [
            {key:'date', label:'日期'}, {key:'start', label:'上班'}, {key:'end', label:'下班'}, {key:'note', label:'備註'}
          ]);
          logAction('修改打卡', sh.staff+' '+sh.date, changes || '（無變更）');
        }
        editingShiftId = null;
      } else {
        const created = Object.assign({ id: uid(), rateOverride: null }, payload);
        shifts.push(created);
        markChanged(created.id);
        logAction('新增打卡', created.staff+' '+created.date, created.start+'–'+created.end);
      }
      shiftListPage = 1;
      saveShifts();
      render();
    },

    addEntry(){
      const date = document.getElementById('f_date').value;
      const scheduledTeacher = document.getElementById('f_teacher').value;
      const region = document.getElementById('f_region').value;
      const courseSel = document.getElementById('f_course').value;
      const classType = document.getElementById('f_classType').value;
      const attendance = document.getElementById('f_attendance').value;
      const note = ((document.getElementById('f_note')||{}).value || '').trim();
      const isSubstitute = document.getElementById('f_isSubstitute').checked;
      const sub = isSubstitute ? App.readSubstituteName() : { kind:null, name:'' };
      const substituteName = sub.name;
      const paidOnSpot = isSubstitute ? document.getElementById('f_paidOnSpot').checked : false;
      let course = courseSel;
      if(courseSel==='__manual__'){ course = document.getElementById('f_courseManual').value.trim(); }
      if(!date || !scheduledTeacher || !course){ alert('請填寫日期、老師與課程內容。'); return; }
      if(isSubstitute && !substituteName){
        alert(sub.kind==='internal' ? '請從清單中選擇代課的老師。' : '請填寫代課老師姓名。');
        return;
      }
      // 代課老師跟原排定老師是同一人 → 其實不是代課
      if(isSubstitute && substituteName === scheduledTeacher){
        alert('代課老師和原本排定的老師是同一位（'+substituteName+'）。\n如果這堂課是他自己上的，請把「本堂課為代課」取消勾選。');
        return;
      }
      if(date > new Date().toISOString().slice(0,10)){ alert('日期不能晚於今天，請確認日期是否選錯。'); return; }
      if(attendance===''){ alert('請填寫上課人數。當天沒有學生到課請填 0。'); return; }
      if(Number(attendance) < 0){ alert('上課人數不能是負數。'); return; }
      if(!isManualPriced(classType) && Number(attendance)===0){
        if(!confirm('人數填 0 表示當天沒有學生到課。\n這堂課不會計算堂費，但車馬費照給。確定嗎？')) return;
      }
      if(Number(attendance)>300){
        if(!confirm('上課人數看起來偏高（超過300人），確定人數沒有打錯嗎？')) return;
      }

      const finalTeacher = isSubstitute ? substituteName : scheduledTeacher;

      // 送出前先讓櫃檯確認一次內容，避免打錯人或打錯課
      const lines = [
        '日期：' + fmtDate(date),
        '老師：' + finalTeacher + (isSubstitute
            ? '（' + (sub.kind==='internal' ? '內師代課' : '外師代課') + '，代 ' + scheduledTeacher + ' 的班'
              + (paidOnSpot ? '；當天已現場支付' : '') + '）'
            : ''),
        '課程：' + course,
        '性質：' + typeLabel(classType),
        '人數：' + (attendance==='' ? '（未填）' : (Number(attendance)===0 ? '0 人（無人到課，只補貼車馬費）' : attendance + ' 人')),
        '出發地區：' + region,
        '備註：' + (note || '（無）')
      ];
      const title = editingId ? '確認要更新這筆紀錄嗎？' : '確認要新增這筆紀錄嗎？';
      if(!confirm(title + '\n\n' + lines.join('\n'))) return;

      const payload = {
        date, teacher: finalTeacher, course, classType, region, note,
        attendance: attendance==='' ? null : Number(attendance),
        isSubstitute, originalTeacher: isSubstitute ? scheduledTeacher : null,
        substituteKind: isSubstitute ? sub.kind : null, paidOnSpot,
        updatedBy: currentUser.username, updatedAt: new Date().toISOString()
      };

      if(editingId){
        const e = entries.find(x=>x.id===editingId);
        if(e){
          const before = Object.assign({}, e);
          Object.assign(e, payload);
          if(!isManualPriced(classType)) e.manualSalary = null;
          if(!('manualSalary' in e)) e.manualSalary = null;
          markChanged(e.id);
          const changes = diffText(before, e, [
            {key:'date', label:'日期'}, {key:'teacher', label:'老師'},
            {key:'course', label:'課程'}, {key:'classType', label:'性質', fmt:v=>typeLabel(v)},
            {key:'attendance', label:'人數'}, {key:'region', label:'地區'},
            {key:'note', label:'備註'}
          ]);
          logAction('修改課程', fmtDate(e.date)+' '+e.teacher+' '+e.course, changes || '（無變更）');

          // 車資是用「老師＋日期＋地區」分組算一趟的。如果這筆改了地區，
          // 同一天原本同組的紀錄會被拆成兩組，車資可能因此被重複計算或漏算。
          // 所以只要地區有變，就檢查同一天還有沒有同組的紀錄，問要不要一起同步。
          if(before.region !== e.region && courseHasTransport(e)){
            const siblings = entries.filter(x=>
              x.id!==e.id && x.teacher===before.teacher && x.date===before.date && x.region===before.region);
            if(siblings.length > 0){
              const syncMsg = '這筆的出發地區改了（' + before.region + '→' + e.region + '）。\n\n'
                + before.teacher + ' ' + fmtDate(before.date) + ' 同一天還有 ' + siblings.length + ' 筆是原本的「' + before.region + '」。\n\n'
                + '要一起改成「' + e.region + '」嗎？\n'
                + '（車資是同一天同地區算一趟，沒有同步的話，這天可能會被拆成兩趟、車資算錯）';
              if(confirm(syncMsg)){
                siblings.forEach(x=>{ x.region = e.region; markChanged(x.id); });
                logAction('地區同步（跟隨修改）', before.teacher + ' ' + fmtDate(before.date),
                  before.region + '→' + e.region + '　同步 ' + siblings.length + ' 筆');
              }
            }
          }
        }
        editingId = null;
        if(editReturnTo){
          mode = 'owner'; ownerTab = editReturnTo.ownerTab;
          salaryMonth = editReturnTo.salaryMonth;
          expandedPayrollTeacher = editReturnTo.expandedPayrollTeacher;
          editReturnTo = null;
        }
      } else {
        const created = Object.assign({ id: uid(), manualSalary: null }, payload);
        entries.push(created);
        markChanged(created.id);
        logAction('新增課程', fmtDate(created.date)+' '+created.teacher+' '+created.course,
          typeLabel(created.classType)+'　人數 '+(created.attendance ?? '-'));
      }
      entryPage = 1;
      saveEntries();
      render();
    },

    saveTeacherEdit(id){
      const t = teachers.find(x=>x.id===id); if(!t) return;
      const input = document.getElementById('editname_'+id);
      if(!input) return;
      const newName = input.value.trim();
      if(!newName){ alert('姓名不能是空的。'); return; }
      const dup = teachers.find(x=> x.id!==id && x.name.trim().toLowerCase()===newName.toLowerCase());
      if(dup){ alert('已經有一位老師叫做「'+dup.name+'」了，姓名不能重複。'); return; }
      const regionEl = document.getElementById('editregion_'+id);
      const newRegion = (regionEl && regionEl.value) ? regionEl.value : t.region;
      if(newName === t.name && newRegion === t.region){ editingTeacherId = null; render(); return; }

      const oldName = t.name;
      // 登記紀錄存的是老師「名字」，改名時必須一併換掉，
      // 否則舊紀錄會留在舊名字底下，薪資總覽會把同一個人算成兩個人。
      let affected = [];
      if(newName !== oldName){
        affected = entries.filter(e=> e.teacher===oldName || e.originalTeacher===oldName);
        if(affected.length > 0){
          const ok = confirm(
            '「'+oldName+'」目前有 '+affected.length+' 筆登記紀錄。\n\n'
            + '改名後，這些紀錄會一起改成「'+newName+'」，薪資才不會被拆成兩個人。\n\n'
            + '確定要改名嗎？'
          );
          if(!ok) return;
        }
      }

      const wasRename = (newName !== oldName);
      const wasRegion = (newRegion !== t.region);
      t.name = newName;
      t.region = newRegion;
      if(newName !== oldName && affected.length > 0){
        entries.forEach(e=>{
          if(e.teacher === oldName){ e.teacher = newName; markChanged(e.id); }
          if(e.originalTeacher === oldName){ e.originalTeacher = newName; markChanged(e.id); }
        });
        saveEntries();
      }
      if(wasRename) logAction('老師改名', oldName+'→'+newName, affected.length>0 ? ('同步更新 '+affected.length+' 筆紀錄') : '');
      else if(wasRegion) logAction('修改老師', newName, '地區 '+oldName+'→'+newRegion);
      editingTeacherId = null;
      saveTeachers(); render();
    },

    previewRegionSync(){
      const f = (document.getElementById('rsFrom')||{}).value || '';
      const t = (document.getElementById('rsTo')||{}).value || '';
      if(f && t && f > t){ alert('起始月份不能晚於結束月份。'); return; }
      regionSyncFrom = f; regionSyncTo = t;
      regionSyncPlan = computeRegionSyncPlan(f, t);

    clearRegionSyncPreview(){ regionSyncPlan = null; render(); },
    applyRegionSync(){
      const p = regionSyncPlan;
      if(!p || p.changes.length === 0) return;
      const diff = p.feeAfter - p.feeBefore;
      const rangeText = (p.fromYm || p.toYm) ? ((p.fromYm||'最早')+' ～ '+(p.toYm||'最新')) : '全部月份';

      if(!confirm(
        '確定要套用嗎？\n\n'
        + '範圍：' + rangeText + '\n'
        + '修改：' + p.entryCount + ' 筆登記紀錄（' + p.changes.length + ' 個老師×日期）\n'
        + '車資總額：$' + p.feeBefore.toLocaleString() + ' → $' + p.feeAfter.toLocaleString()
        + '（' + (diff>0?'+':'') + '$' + diff.toLocaleString() + '）\n\n'
        + '這個動作無法復原。')) return;

      if(!confirm('最後確認：你已經下載備份檔了嗎？\n\n按「確定」開始寫入。')) return;

      // 重新對照 id 寫入，避免預覽後資料被重新載入導致改到舊物件
      let applied = 0;
      p.changes.forEach(g=>{
        g.items.forEach(i=>{
          const e = entries.find(x=>x.id===i.id);
          if(e && e.region === g.from){ e.region = g.to; markChanged(e.id); applied++; }
        });
      });

      logAction('車資地區批次校正', rangeText,
        '修改 ' + applied + ' 筆　車資 $' + p.feeBefore.toLocaleString()
        + '→$' + p.feeAfter.toLocaleString());
      regionSyncPlan = null;
      saveEntries();
      render();
      alert('已完成：實際更新 ' + applied + ' 筆紀錄。\n\n請到「薪資總覽」確認車資是否正確。');
    },

    saveRegionEdit(id){

      const nameEl = document.getElementById('regionName_'+id);
      const feeEl = document.getElementById('regionFee_'+id);
      const name = nameEl.value.trim();
      if(!name){ alert('地區名稱不能是空的。'); return; }

      if(dup){ alert('已經有一個地區叫做「'+name+'」了，名稱不能重複。'); return; }

      const oldName = r.name;

      // 查不到對應地區，車資會無聲變成 0。

      if(name !== oldName){
        affectedEntries = entries.filter(e=>e.region===oldName);
        affectedTeachers = teachers.filter(t=>t.region===oldName);
        if(affectedEntries.length > 0 || affectedTeachers.length > 0){
          const ok = confirm(
            '「'+oldName+'」改名為「'+name+'」。\n\n'
            + '會一併更新：登記紀錄 '+affectedEntries.length+' 筆、老師出發地區 '+affectedTeachers.length+' 位。\n\n'
            + '（不一起更新的話，舊紀錄的車資會變成 0 元）\n\n確定要改名嗎？'
          );
          if(!ok) return;
        }
      }

      const oldFee = Number(r.fee)||0;
      const newFee = Number(feeEl.value)||0;
      r.name = name;
      r.fee = newFee;
      if(name!==oldName || oldFee!==newFee){
        const parts = [];
        if(name!==oldName) parts.push('名稱 '+oldName+'→'+name);
        if(oldFee!==newFee) parts.push('車資 $'+oldFee+'→$'+newFee);
        logAction('修改地區', name, parts.join('、'));
      }
      if(name !== oldName){
        if(affectedEntries.length > 0){
          entries.forEach(e=>{ if(e.region===oldName){ e.region = name; markChanged(e.id); } });
          saveEntries();
        }
        if(affectedTeachers.length > 0){
          teachers.forEach(t=>{ if(t.region===oldName) t.region = name; });
          saveTeachers();
        }
      }
      editingRegionId = null;
      saveSettings(); render();
    },
    deleteRegion(id){
      const r = settings.regions.find(x=>x.id===id); if(!r) return;
      const affected = teachers.filter(t=>t.region===r.name);
      let msg = '確定要刪除地區「'+r.name+'」嗎？已登記的舊紀錄會保留原本文字，但車資將視同 0 元計算。';
      if(affected.length>0){
        msg += '\n\n注意：目前有 '+affected.length+' 位老師的出發地區設定為「'+r.name+'」（'+affected.map(t=>t.name).join('、')+'），刪除後會自動改成清單中第一個剩餘地區，請記得之後再去「教師設定」確認一次。';
      }
      if(!confirm(msg)) return;
      logAction('刪除地區', r.name, '車資 $'+(Number(r.fee)||0));
      settings.regions = settings.regions.filter(x=>x.id!==id);
      if(editingRegionId===id) editingRegionId=null;
      if(affected.length>0 && settings.regions.length>0){
        const fallback = sortedRegions()[0].name;
        affected.forEach(t=>{ t.region = fallback; });
        saveTeachers();
      }
      saveSettings(); render();
    },
    addRegion(){
      const name = document.getElementById('newRegionSelect').value;
      const fee = Number(document.getElementById('newRegionFee').value)||0;
      if(!name){ alert('請選擇要新增的縣市。'); return; }
      if(settings.regions.some(r=>r.name===name)){ alert('這個地區已經存在了。'); return; }
      const idx = TAIWAN_REGIONS.indexOf(name);
      const order = idx>=0 ? idx : (settings.regions.reduce((m,r)=>Math.max(m,r.order),0)+1);
      settings.regions.push({id:uid(), name, fee, order});
      logAction('新增地區', name, '車資 $'+fee);
      saveSettings(); render();
    },

    async addAccount(){
      const u = document.getElementById('newAccUser').value.trim();
      const p = document.getElementById('newAccPass').value;
      const role = document.getElementById('newAccRole').value;
      const nick = (document.getElementById('newAccNick').value||'').trim();
      const newEmail = normEmail((document.getElementById('newAccEmail')||{}).value);
      if(!u || !p){ alert('請輸入帳號與密碼。'); return; }
      if(newEmail && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(newEmail)){ alert('Google 帳號的格式看起來不對。'); return; }
      if(newEmail && settings.accounts.some(a=> normEmail(a.email)===newEmail)){
        alert('這個 Google 帳號已經綁在其他人身上了。'); return; }
      if(!/^[a-zA-Z0-9._-]+$/.test(u)){ alert('帳號只能使用英文字母、數字、句點、底線與連字號。'); return; }
      if(p.length < MIN_PASSWORD_LEN){ alert('密碼至少要 '+MIN_PASSWORD_LEN+' 碼。'); return; }
      if(settings.accounts.some(a=>a.username===u)){ alert('這個帳號名稱已經存在，請換一個。'); return; }
      try{
        await createAuthUser(u, p);
      }catch(e){
        alert('建立帳號失敗：'+authErrorText(e)+'\n\n（帳號尚未新增，請調整後再試一次。）'); return;
      }
      settings.accounts.push({id:uid(), username:u, displayName:nick, email:newEmail, role, active:true, authMigratedAt:new Date().toISOString()});
      logAction('新增帳號', u, roleLabel(role)+(nick?('　稱呼 '+nick):''));
      saveSettings(); render();
    },
    startAccountEdit(id){
      editingAccountId = id; render();
      setTimeout(()=>{
        const el = document.getElementById('accNick_'+id);
        if(el){ el.focus(); el.select(); }
      }, 30);
    },
    cancelAccountEdit(){ editingAccountId = null; render(); },
    saveAccountEdit(id){
      const acc = settings.accounts.find(a=>a.id===id); if(!acc) return;
      const nickEl = document.getElementById('accNick_'+id);
      const nick = nickEl ? nickEl.value.trim() : (acc.displayName||'');
      const emailEl = document.getElementById('accEmail_'+id);
      const newEmail = emailEl ? normEmail(emailEl.value) : (acc.email||'');
      if(newEmail && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(newEmail)){ alert('Google 帳號的格式看起來不對。'); return; }
      if(newEmail && settings.accounts.some(a=> a.id!==id && normEmail(a.email)===newEmail)){
        alert('這個 Google 帳號已經綁在其他人身上了。'); return; }
      const roleEl = document.getElementById('accRole_'+id);
      const newRole = (roleEl && ROLE_LABEL[roleEl.value]) ? roleEl.value : acc.role;
      // 不能把最後一位啟用中的經營者降級，否則沒有人能進系統設定了
      if(acc.role==='boss' && newRole!=='boss' && acc.active && activeBossCount(id)===0){
        alert('至少需要保留一位啟用中的經營者，無法變更這個帳號的角色。'); return;
      }
      if(acc.id === (settings.accounts.find(a=>a.username===currentUser.username)||{}).id
         && newRole !== acc.role){
        if(!confirm('你正在變更「自己」的角色（'+roleLabel(acc.role)+'→'+roleLabel(newRole)+'）。\n\n'
          + '降級後可能無法再進入目前的頁面，確定嗎？')) return;
      }
      const parts = [];
      if((acc.displayName||'')!==nick) parts.push('稱呼 '+(acc.displayName||'（空）')+'→'+(nick||'（空）'));
      if(acc.role!==newRole) parts.push('角色 '+roleLabel(acc.role)+'→'+roleLabel(newRole));
      if(normEmail(acc.email)!==newEmail) parts.push('Google 帳號 '+(acc.email||'（未綁定）')+'→'+(newEmail||'（未綁定）'));
      acc.displayName = nick;
      acc.role = newRole;
      acc.email = newEmail;
      if(parts.length) logAction('修改帳號', acc.username, parts.join('、'));
      editingAccountId = null;
      saveSettings(); render();
    },
    toggleAccountActive(id){
      const acc = settings.accounts.find(a=>a.id===id); if(!acc) return;
      if(acc.active && acc.role==='boss' && activeBossCount(id)===0){
        alert('至少需要保留一位啟用中的經營者帳號，無法停用。'); return;
      }
      acc.active = !acc.active;
      logAction(acc.active?'啟用帳號':'停用帳號', acc.username, '');
      saveSettings(); render();
    },
    deleteAccount(id){
      const acc = settings.accounts.find(a=>a.id===id); if(!acc) return;
      if(acc.role==='boss' && activeBossCount(id)===0){ alert('至少需要保留一位啟用中的經營者帳號，無法刪除。'); return; }
      if(!confirm('確定要刪除帳號「'+acc.username+'」嗎？\n\n注意：這只會從本系統移除，Firebase Auth 上的登入帳號需要到 Firebase 主控台手動刪除。\n若只是想暫時停權，建議改用「停用」。')) return;
      logAction('刪除帳號', acc.username, '');
      settings.accounts = settings.accounts.filter(a=>a.id!==id);
      saveSettings(); render();
    },

    downloadJsonBackup(){
      const backupData = { exportedAt: new Date().toISOString(), teachers, entries, settings, shifts, bonuses };
      const blob = new Blob([JSON.stringify(backupData, null, 2)], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'BBS_Studio_備份_'+new Date().toISOString().slice(0,10)+'.json';
      a.click();
    },
    async unlockSensitive(){
      const passEl = document.getElementById('sensitiveUnlockPass');
      const p = passEl ? passEl.value : '';
      const acc = settings.accounts.find(a=>a.username===currentUser.username);
      // Google 登入的人沒有密碼，改用 Google 重新驗證身分
      if(isGoogleSession()){
        try{
          await fbAuth.currentUser.reauthenticateWithPopup(googleProvider());
          sensitiveUnlocked = true; render(); return;
        }catch(e){
          const code = (e && e.code) || '';
          if(code === 'auth/user-mismatch'){
            alert('選到的 Google 帳號跟你目前登入的不是同一個。\n\n請再按一次「確認開啟」，這次務必選擇你自己登入用的那個 Google 帳號。');
            return;
          }
          if(code === 'auth/popup-blocked' || code === 'auth/operation-not-supported-in-this-environment'){
            // 瀏覽器擋掉彈出視窗（常見於手機瀏覽器、LINE／Messenger 內建瀏覽器），改用整頁跳轉驗證
            try{
              sessionStorage.setItem('bbsPendingReauth', '1');
              await fbAuth.currentUser.reauthenticateWithRedirect(googleProvider());
            }catch(e2){ alert('無法開啟驗證視窗：' + authErrorText(e2)); }
            return;
          }
          if(code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request'){
            alert('驗證視窗在完成前被關閉了，請再試一次，並在彈出的視窗中選擇你的 Google 帳號直到跳回系統為止。');
            return;
          }
          alert('Google 驗證失敗：' + authErrorText(e) + '\n\n如果一直失敗，可以截圖這則訊息回報。');
        }
        return;
      }
      // 已遷移的帳號用 Firebase 重新驗證；尚未遷移的沿用舊的明文比對
      if(fbAuth && fbAuth.currentUser && !(acc && acc.password)){
        try{
          const cred = firebase.auth.EmailAuthProvider.credential(emailOf(currentUser.username), p);
          await fbAuth.currentUser.reauthenticateWithCredential(cred);
          sensitiveUnlocked = true; render(); return;
        }catch(e){ alert('密碼錯誤。'); return; }
      }
      if(acc && acc.password===p){ sensitiveUnlocked = true; render(); }
      else { alert('密碼錯誤。'); }
    },
    setAuditFilterDate(v){ auditFilterDate = v||''; auditPage = 1; render(); },
    setAuditFilterWho(v){ auditFilterWho = v||''; auditPage = 1; render(); },
    clearAuditFilters(){ auditFilterDate=''; auditFilterWho=''; auditPage=1; render(); },
    setAuditPage(n){
      auditPage = Math.max(1, Number(n)||1);
      render();
    },
    changeMyDisplayName(){
      const nick = (document.getElementById('myAccountNick').value||'').trim();
      const acc = settings.accounts.find(a=>a.username===currentUser.username);
      if(!acc){ alert('找不到目前的帳號資料，請重新登入後再試。'); return; }
      const oldNick = acc.displayName||'';
      acc.displayName = nick;
      if(oldNick!==nick) logAction('修改帳號', acc.username, '稱呼 '+(oldNick||'（空）')+'→'+(nick||'（空）'));
      saveSettings(); render();
      alert(nick ? ('稱呼已更新為「'+nick+'」。') : '已清除稱呼，畫面上會顯示帳號。');
    },
    async changeMyPassword(){
      const oldPass = document.getElementById('myAccountOldPass').value;
      const newPass = document.getElementById('myAccountNewPass').value;
      const newPass2 = document.getElementById('myAccountNewPass2').value;
      const acc = settings.accounts.find(a=>a.username===currentUser.username);
      if(!acc){ alert('找不到目前的帳號資料，請重新登入後再試。'); return; }
      if(!newPass){ alert('請輸入新密碼。'); return; }
      if(newPass!==newPass2){ alert('兩次輸入的新密碼不一致，請再檢查一次。'); return; }
      if(newPass===oldPass){ alert('新密碼不能跟目前密碼一樣。'); return; }
      if(newPass.length < MIN_PASSWORD_LEN){ alert('新密碼至少要 '+MIN_PASSWORD_LEN+' 碼。'); return; }
      if(isGoogleSession()){
        alert('你目前是用 Google 帳號登入，密碼由 Google 保管。\n\n'
          + '要修改密碼請到 Google 帳號設定（myaccount.google.com）。\n'
          + '忘記密碼時也是在那裡重設，不需要經過這個系統。'); return;
      }
      if(!fbAuth || !fbAuth.currentUser){ alert('目前不是以 Firebase Auth 登入，請重新登入後再修改密碼。'); return; }
      try{
        // 先用目前密碼重新驗證身分，再更新密碼（Firebase 的安全要求）
        const cred = firebase.auth.EmailAuthProvider.credential(emailOf(currentUser.username), oldPass);
        await fbAuth.currentUser.reauthenticateWithCredential(cred);
        await fbAuth.currentUser.updatePassword(newPass);
      }catch(e){
        const code = (e && e.code) || '';
        if(['auth/wrong-password','auth/invalid-credential','auth/invalid-login-credentials'].indexOf(code)>=0){
          alert('目前密碼不正確。'); return;
        }
        alert('密碼更新失敗：'+authErrorText(e)); return;
      }
      if(acc.password){ delete acc.password; acc.authMigratedAt = new Date().toISOString(); }
      logAction('修改帳號', acc.username, '密碼已變更');
      await saveSettings();
      alert('密碼已更新，下次登入請使用新密碼。');
      document.getElementById('myAccountOldPass').value='';
      document.getElementById('myAccountNewPass').value='';
      document.getElementById('myAccountNewPass2').value='';
    },

    restoreFromBackupFile(){
      const input = document.getElementById('restoreFileInput');
      const file = input.files && input.files[0];
      if(!file){ alert('請先選擇備份檔案。'); return; }
      if(!confirm('確定要用這個備份檔覆蓋目前雲端上的所有資料嗎？此動作無法復原。')) return;
      const reader = new FileReader();
      reader.onload = (e)=>{
        try{
          const data = JSON.parse(e.target.result);
          if(data.teachers) teachers = data.teachers;
          if(data.entries) entries = data.entries;
          if(data.settings){
            settings = data.settings;
            if(!settings.accounts || settings.accounts.length===0) settings.accounts = defaultSettings().accounts;
            if(!settings.regions || settings.regions.length===0) settings.regions = defaultSettings().regions;
            if(settings.defaultHourlyRate===undefined || settings.defaultHourlyRate===null) settings.defaultHourlyRate = 210;
            if(!Array.isArray(settings.staffRates)) settings.staffRates = [];
            if(!Array.isArray(settings.courseTypes) || settings.courseTypes.length===0) settings.courseTypes = defaultCourseTypes();
          }
          if(data.shifts) shifts = data.shifts;
          if(data.bonuses) bonuses = data.bonuses;
          saveTeachers(); saveEntries(); saveSettings(); saveShifts(); saveBonuses();
          logAction('還原備份', file.name||'備份檔', '以備份檔覆蓋全部資料');
          alert('已還原備份資料。');
          render();
        }catch(err){
          console.error(err);
          alert('讀取備份檔失敗，請確認檔案格式正確（需為本工具匯出的 JSON 備份檔）。');
        }
      };
      reader.readAsText(file);
    },

    wipeAll(){
      if(!confirm('第一次確認：這會清空「所有」登記紀錄與教師設定，且無法復原，確定要繼續嗎？')) return;
      if(!confirm('第二次確認：真的要全部清空嗎？建議先按「匯出 CSV 備份」保留資料。')) return;
      logAction('清空資料', '登記紀錄與教師', '清空前 '+entries.length+' 筆課程、'+teachers.length+' 位老師');
      entries = []; teachers = [];
      saveEntries(); saveTeachers();
      render();
    }
  };
  window.App = App;

  // ===== 啟動（v3.0）=====
  // 有 Firebase Auth 時，先等它回報登入狀態，才決定要載入資料還是顯示登入畫面。
  // 這樣重新整理頁面後不會被登出。
  if(fbAuth){
    // 如果剛剛是「危險區域」驗證因為彈出視窗被擋、改用整頁跳轉的流程回來，這裡接住結果。
    // 一定要在 onAuthStateChanged 之前呼叫 getRedirectResult，不然這個結果會被吃掉、拿不到。
    (async ()=>{
      let pendingReauth = false;
      try{ pendingReauth = sessionStorage.getItem('bbsPendingReauth') === '1'; }catch(e){}
      if(!pendingReauth) return;
      try{ sessionStorage.removeItem('bbsPendingReauth'); }catch(e){}
      try{
        const result = await fbAuth.getRedirectResult();
        if(result && result.user){
          // 這個流程一定是從系統設定頁觸發的，直接還原畫面；
          // 真正的權限檢查在畫面渲染時還是會照常進行，這裡不判斷不會有資安疑慮。
          sensitiveUnlocked = true;
          mode = 'owner'; ownerTab = 'settings';
          render();
        }
      }catch(e){
        alert('身分驗證失敗：' + authErrorText(e));
      }
    })();
    fbAuth.onAuthStateChanged(async (user)=>{
      if(authBooted) return;   // 只處理頁面載入時的第一次還原
      authBooted = true;
      if(user){
        try{
          // 合成 email＝舊的帳號密碼登入；其他一律當成 Google 登入
          if(isSyntheticEmail(user.email)) await afterAuthLogin(usernameFromEmail(user.email));
          else await afterGoogleLogin(user);
        }catch(e){
          try{ await fbAuth.signOut(); }catch(_){}
          currentUser = null;
          loginError = (e && e.message) || '';
        }
        render();
      }else{
        // 尚未登入：仍需載入 settings 以支援尚未遷移帳號的舊制驗證
        loadAll();
      }
    });
  }else{
    loadAll();
  }

  loadAll();
})();
</script>
