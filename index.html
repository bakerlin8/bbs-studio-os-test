<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />

<title>BBS Studio 營運與薪資系統</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  :root{
    --font-display:'Fraunces', serif;
    --font-body:'Inter', -apple-system, sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--font-body);background:var(--bg,#3A342C);color:var(--ink,#221F1D);min-height:100vh;}

  /* ===== 三組主題（日式配色） =====
     登入頁「障子」：深木底 + 生成色紙卡
     前台「生成」  ：紙白底，長時間輸入用
     後台「墨と金」：墨底 + 金茶，深色沉穩
     主題 class 會同時掛在 body 與 #app 上，body 才拿得到變數、
     整個頁面的底色（含捲動超出範圍的部分）才會跟著換。 */

  .theme-login{
    color-scheme: light;
    --bg:#3A342C; --surface:#FBFAF5; --surface-2:#F1ECE0;
    --ink:#221F1D; --ink-soft:#5B554C;
    --accent:#9E3D3F; --accent-ink:#FBFAF5; --accent-2:#165E83;
    --border:#E2DCCD; --danger:#9B2F2B; --success:#316745;
    --locked-bg:#EFE9DC;
    --pill-group-bg:#9E3D3F16;   --pill-group-fg:#8C3436;
    --pill-trial-bg:#B5811E1F;   --pill-trial-fg:#7E5711;
    --pill-individual-bg:#3167451A; --pill-individual-fg:#2A5A3B;
    --pill-muted-bg:#00000014;
    --summary-bg-1:#F1EADC; --summary-bg-2:#E9E0CE; --summary-border:#DBD0BA;
    --summary-ink:#2E2A24; --summary-label:#5B554C;
    --summary-item-bg:#FFFFFBD9; --summary-item-border:#DDD2BC;
    --summary-total-bg:#9E3D3F14; --summary-total-border:#9E3D3F55; --summary-total-ink:#8C3436;
    --staff-accent:#9E3D3F66;
    --staff-total-bg:#F1ECE0; --staff-total-border:#DED4C0; --staff-total-ink:#8C3436;
    --bonus-bg:#B5811E0F; --bonus-border:#B5811E5C;
    --namebar-bg:#F0E7D6; --namebar-bg-inactive:#E8E3D6; --namebar-hover:#EADFC9; --namebar-hover-inactive:#E0DACB;
    --namebar-ink:#2E2A24; --namebar-ink-soft:#5B554C; --namebar-line:#00000014;
    --namebar-field-bg:#FFFFFBE6; --namebar-field-border:#2E2A2440;
    --namebar-danger:#8C3436; --namebar-danger-border:#8C343666; --namebar-pill-bg:#2E2A2418;
    --slip-bg:#FFFFFB; --slip-ink:#221F1D; --slip-ink-mid:#5B554C; --slip-ink-soft:#6E675C;
    --slip-border:#E2DCCD; --slip-line:#EAE4D7; --slip-line-strong:#DCD3C1; --slip-shadow:rgba(0,0,0,.12);
    --pill-subin-bg:#165E831F;  --pill-subin-fg:#12506F;
    --pill-subout-bg:#5B4A8A1F; --pill-subout-fg:#4E3F78;
    --tone-1:#9E3D3F; --tone-2:#165E83; --tone-3:#2A5A3B; --tone-4:#7E5711; --tone-5:#5B4A8A;
  }

  .theme-front{
    color-scheme: light;
    --bg:#FBFAF5; --surface:#FFFFFB; --surface-2:#F1ECE0;
    --ink:#221F1D; --ink-soft:#5B554C;
    --accent:#9E3D3F; --accent-ink:#FBFAF5; --accent-2:#165E83;
    --border:#E2DCCD; --danger:#9B2F2B; --success:#316745;
    --locked-bg:#EFE9DC;
    --pill-group-bg:#9E3D3F16;   --pill-group-fg:#8C3436;
    --pill-trial-bg:#B5811E1F;   --pill-trial-fg:#7E5711;
    --pill-individual-bg:#3167451A; --pill-individual-fg:#2A5A3B;
    --pill-muted-bg:#00000014;
    --summary-bg-1:#F1EADC; --summary-bg-2:#E9E0CE; --summary-border:#DBD0BA;
    --summary-ink:#2E2A24; --summary-label:#5B554C;
    --summary-item-bg:#FFFFFBD9; --summary-item-border:#DDD2BC;
    --summary-total-bg:#9E3D3F14; --summary-total-border:#9E3D3F55; --summary-total-ink:#8C3436;
    --staff-accent:#9E3D3F66;
    --staff-total-bg:#F1ECE0; --staff-total-border:#DED4C0; --staff-total-ink:#8C3436;
    --bonus-bg:#B5811E0F; --bonus-border:#B5811E5C;
    --namebar-bg:#F0E7D6; --namebar-bg-inactive:#E8E3D6; --namebar-hover:#EADFC9; --namebar-hover-inactive:#E0DACB;
    --namebar-ink:#2E2A24; --namebar-ink-soft:#5B554C; --namebar-line:#00000014;
    --namebar-field-bg:#FFFFFBE6; --namebar-field-border:#2E2A2440;
    --namebar-danger:#8C3436; --namebar-danger-border:#8C343666; --namebar-pill-bg:#2E2A2418;
    --slip-bg:#FFFFFB; --slip-ink:#221F1D; --slip-ink-mid:#5B554C; --slip-ink-soft:#6E675C;
    --slip-border:#E2DCCD; --slip-line:#EAE4D7; --slip-line-strong:#DCD3C1; --slip-shadow:rgba(0,0,0,.12);
    --pill-subin-bg:#165E831F;  --pill-subin-fg:#12506F;
    --pill-subout-bg:#5B4A8A1F; --pill-subout-fg:#4E3F78;
    --tone-1:#9E3D3F; --tone-2:#165E83; --tone-3:#2A5A3B; --tone-4:#7E5711; --tone-5:#5B4A8A;
  }

  .theme-owner{
    color-scheme: dark;
    --bg:#1A1A18; --surface:#232220; --surface-2:#2C2A27;
    --ink:#F3F1EC; --ink-soft:#C3BCB0;
    --accent:#D9A34A; --accent-ink:#1A1A18; --accent-2:#5C9291;
    --border:#423E38; --danger:#E5938C; --success:#A3BE8C;
    --locked-bg:#31302C;
    --pill-group-bg:#D9A34A26;   --pill-group-fg:#E7BE7C;
    --pill-trial-bg:#5C929126;   --pill-trial-fg:#8FBCBB;
    --pill-individual-bg:#A3BE8C26; --pill-individual-fg:#B4CC9F;
    --pill-muted-bg:#FFFFFF1A;
    --summary-bg-1:#332F2A; --summary-bg-2:#2B2925; --summary-border:#4E4941;
    --summary-ink:#F5F3EE; --summary-label:#C9C2B6;
    --summary-item-bg:#00000038; --summary-item-border:#4E4941;
    --summary-total-bg:#D9A34A26; --summary-total-border:#D9A34A80; --summary-total-ink:#EFC079;
    --staff-accent:#D9A34A88;
    --staff-total-bg:#2A2825; --staff-total-border:#47423B; --staff-total-ink:#EFC079;
    --bonus-bg:#D9A34A12; --bonus-border:#D9A34A59;
    --namebar-bg:#332F2A; --namebar-bg-inactive:#292723; --namebar-hover:#3D3830; --namebar-hover-inactive:#302D28;
    --namebar-ink:#F5F3EE; --namebar-ink-soft:#C9C2B6; --namebar-line:#FFFFFF14;
    --namebar-field-bg:#00000040; --namebar-field-border:#FFFFFF2E;
    --namebar-danger:#E5938C; --namebar-danger-border:#E5938C66; --namebar-pill-bg:#FFFFFF1A;
    --slip-bg:#262420; --slip-ink:#F3F1EC; --slip-ink-mid:#C9C2B6; --slip-ink-soft:#B3AB9C;
    --slip-border:#45403A; --slip-line:#3A3632; --slip-line-strong:#4E4941; --slip-shadow:rgba(0,0,0,.45);
    --pill-subin-bg:#8FB4D826;  --pill-subin-fg:#9FC0DE;
    --pill-subout-bg:#B9A9DC26; --pill-subout-fg:#C2B4E1;
    --tone-1:#E29A8E; --tone-2:#8FB4D8; --tone-3:#A3BE8C; --tone-4:#D9A34A; --tone-5:#B9A9DC;
  }

  #app{min-height:100vh;padding-bottom:60px;background:var(--bg);color:var(--ink);}
  .wrap{max-width:1000px;margin:0 auto;padding:0 20px;}

  .topbar{border-bottom:1px solid var(--border);background:var(--surface);padding:16px 0;position:sticky;top:0;z-index:20;}
  .topbar-inner{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;}
  .brand{display:flex;align-items:baseline;gap:10px;}
  .brand h1{font-family:var(--font-display);font-style:italic;font-weight:600;font-size:23px;margin:0;color:var(--ink);}
  .brand span{color:var(--ink-soft);font-size:12px;letter-spacing:.5px;}
  .brand .version-tag{
    font-size:10.5px;letter-spacing:.5px;font-weight:600;
    color:var(--accent);background:color-mix(in srgb, var(--accent) 12%, transparent);
    padding:1px 7px;border-radius:9px;align-self:center;
  }
  .userbox{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .userchip{font-size:12.5px;color:var(--ink-soft);}
  .modeswitch{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:8px;border:1px solid var(--border);}
  .modeswitch button{border:none;background:transparent;padding:7px 15px;border-radius:6px;font-family:var(--font-body);font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
  .modeswitch button.active{background:var(--accent);color:var(--accent-ink);}

  .title-icon{display:inline-flex;color:var(--accent);flex-shrink:0;}
  .title-icon svg{width:19px;height:19px;display:block;}
  h2.section-title{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:600;font-size:21px;margin:28px 0 4px;color:var(--ink);}
  p.section-sub{color:var(--ink-soft);font-size:13.5px;margin:0 0 12px;line-height:1.65;}
  /* 條列式說明：多個重點時用這個，比整段文字好掃讀 */
  ul.note-list{color:var(--ink-soft);font-size:13px;margin:0 0 14px;padding-left:18px;line-height:1.75;}
  ul.note-list li{margin:3px 0;}
  ul.note-list strong{color:var(--ink);font-weight:600;}
  ul.note-list.tight{font-size:12px;margin:6px 0 10px;}

  /* ---------- 課程設定頁 ---------- */
  /* 四種計薪模式各一個代表色，卡片與下方說明共用 */
  .tone-tiered  { --course-tone:var(--pill-group-fg); }      /* 人數級距型 = 蘇芳 */
  .tone-fixed   { --course-tone:var(--pill-trial-fg); }      /* 固定單價型 = 金茶 */
  .tone-quoted  { --course-tone:var(--pill-individual-fg); } /* 逐案報價型 = 松綠 */
  .tone-monthly { --course-tone:var(--accent-2); }           /* 包月型     = 輔色 */

  .course-group-title{font-size:12px;font-weight:700;letter-spacing:.5px;color:var(--ink-soft);margin:8px 0 12px;}
  .course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;}
  .course-card{
    background:var(--surface);border:1px solid var(--border);
    border-top:3px solid var(--course-tone);
    border-radius:10px;padding:15px 17px;
    transition:transform .16s ease, box-shadow .16s ease;
  }
  .course-card:hover{
    transform:translateY(-3px);
    box-shadow:0 6px 18px color-mix(in srgb, var(--course-tone) 22%, transparent);
  }
  .course-card.planned{opacity:.9;}
  .course-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:2px;}
  .course-name{font-family:var(--font-display);font-size:16px;font-weight:700;color:var(--course-tone);}
  .pill.course-status{background:color-mix(in srgb, var(--course-tone) 14%, transparent);color:var(--course-tone);}
  .course-model{
    display:inline-block;font-size:11px;font-weight:600;color:var(--course-tone);
    background:color-mix(in srgb, var(--course-tone) 12%, transparent);
    padding:1px 8px;border-radius:10px;margin-bottom:8px;
  }
  .course-summary{font-size:12.5px;color:var(--ink-soft);line-height:1.55;margin-bottom:8px;}
  .course-rules{list-style:none;margin:0 0 10px;padding:0;font-size:12.5px;line-height:1.7;}
  .course-rules li{position:relative;padding-left:14px;color:var(--ink);}
  .course-rules li::before{content:"";position:absolute;left:2px;top:9px;width:4px;height:4px;border-radius:50%;background:var(--course-tone);}
  .course-foot{font-size:12px;color:var(--ink-soft);border-top:1px solid var(--border);padding-top:8px;}
  .course-foot strong{color:var(--ink);}

  .callout-box{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-top:22px;}
  .callout-box-title{font-weight:700;color:var(--accent);margin-bottom:10px;font-size:13px;}
  /* 說明清單：每種模式的色點與著色標籤，跟卡片顏色對應 */
  .model-list{list-style:none;margin:0;padding:0;font-size:12.5px;line-height:1.5;}
  .model-list li{position:relative;padding-left:16px;margin:7px 0;}
  .model-list li::before{content:"";position:absolute;left:0;top:6px;width:8px;height:8px;border-radius:50%;background:var(--course-tone);}
  .model-list .model-name{font-weight:700;color:var(--course-tone);margin-right:6px;}
  .model-list .model-desc{color:var(--ink-soft);}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:24px;margin-bottom:22px;}
  .card-title{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px;color:var(--ink);margin:0 0 4px;letter-spacing:.2px;}
  .card-title .title-icon svg{width:16px;height:16px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  @media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr;}}

  label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;letter-spacing:.2px;}
  input[type=text], input[type=date], input[type=month], input[type=number], input[type=password], select, textarea{
    width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:6px;
    background:var(--surface-2);color:var(--ink);font-family:var(--font-body);font-size:14px;
  }
  /* 手機版 Safari 對 type=date／type=month 這兩種原生元件的 width:100% 支援不穩定，
     是很多人都踩過的知名相容性問題——即使設了 100%，Safari 有時還是照自己算的內容寬度顯示，
     導致跟旁邊/上下的 select 對不齊。加 -webkit-appearance:none 重置預設樣式、
     display:block 加上明確的 box-sizing，才能強制它真的吃滿 100% 寬度。 */
  input[type=date], input[type=month]{
    display:block;box-sizing:border-box;min-width:0;-webkit-appearance:none;appearance:none;
  }
  input:focus, select:focus, textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}
  /* 鎖定中的欄位：用底色與游標表示不可編輯，文字維持完整對比，才讀得清楚 */
  input:disabled, select:disabled{opacity:1;cursor:not-allowed;background:var(--locked-bg);color:var(--ink);border-color:var(--border);}
  /* 這行很重要：<input type=date/month> 這類瀏覽器原生元件有自己的最小內容寬度，
     在 grid 容器裡格子預設不會縮小到低於這個寬度（CSS Grid 的 min-width:auto 特性），
     於是日期框會把自己的格子撐大，把同一排的其他欄位擠歪、寬度對不齊。
     加 min-width:0 讓格子可以真正縮到 1fr 該有的寬度，全站的日期框排版一次修好。 */
  .field{margin-bottom:14px;min-width:0;}
  .inline-note{font-size:12px;color:var(--ink-soft);margin-top:4px;line-height:1.6;}

  button.btn{font-family:var(--font-body);font-weight:600;font-size:13.5px;padding:10px 18px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;}
  button.btn.outline{background:transparent;color:var(--ink);border:1px solid var(--border);}
  button.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
  button.btn.small{padding:5px 10px;font-size:12px;}
  button.btn:hover{filter:brightness(1.06);}
  button.btn:disabled{opacity:.55;cursor:not-allowed;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--border);padding:8px 6px;font-weight:700;}
  td{padding:9px 6px;border-bottom:1px solid var(--border);vertical-align:middle;color:var(--ink);}
  td.num, th.num{font-family:var(--font-mono);text-align:right;}
  td.center, th.center{text-align:center;}
  tr.subtotal td{font-weight:700;background:var(--surface-2);color:var(--ink);}
  /* 後台明細依課程性質分區：類別標頭列 + 每區小計 */
  tr.detail-group-row td{
    font-weight:700;font-size:12.5px;letter-spacing:.5px;
    background:color-mix(in srgb, var(--accent) 10%, transparent);
    color:var(--ink);padding-top:8px;padding-bottom:8px;
  }
  tr.detail-subtotal td{
    font-weight:600;font-family:var(--font-mono);color:var(--ink-soft);
    background:color-mix(in srgb, var(--ink) 3%, transparent);
    border-top:1px solid var(--border);
  }
  tr.grandtotal td{font-weight:700;font-family:var(--font-mono);color:var(--ink);}

  /* 分頁選單固定在頂端列下方，往下捲動時不會跟著消失。
     --topbar-h 由 JS 在每次畫面重繪後量出頂端列實際高度並寫入，
     這樣不管手機或電腦、有沒有出現警告橫幅，選單都會準確貼在頂端列正下方，不會留空隙或疊在一起。 */
  .tabs{display:flex;gap:6px;border-bottom:1px solid var(--border);margin-bottom:20px;flex-wrap:wrap;
    position:sticky;top:var(--topbar-h,58px);z-index:19;background:var(--bg);}
  .tabs button{background:none;border:none;padding:10px 14px;font-size:13.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent;}
  .tabs button.active{color:var(--accent);border-bottom:2px solid var(--accent);}

  .pill{display:inline-block;padding:2px 9px;border-radius:100px;font-size:11.5px;font-weight:600;}
  .pill.group{background:var(--pill-group-bg);color:var(--pill-group-fg);}
  .pill.trial{background:var(--pill-trial-bg);color:var(--pill-trial-fg);}
  .pill.individual{background:var(--pill-individual-bg);color:var(--pill-individual-fg);}
  .pill.muted{background:var(--pill-muted-bg);color:var(--ink-soft);}
  .pill.subin{background:var(--pill-subin-bg);color:var(--pill-subin-fg);}
  .pill.subout{background:var(--pill-subout-bg);color:var(--pill-subout-fg);}

  .taglist{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px;}
  .tag{background:var(--surface-2);border:1px solid var(--border);padding:3px 9px;border-radius:100px;font-size:12px;display:flex;align-items:center;gap:6px;color:var(--ink);}
  .tag button{border:none;background:none;color:var(--danger);cursor:pointer;font-size:13px;padding:0;line-height:1;}

  .empty{color:var(--ink-soft);font-size:13.5px;padding:20px 0;text-align:center;border:1px dashed var(--border);border-radius:8px;}
  .stat{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
  .stat-label{color:var(--ink-soft);font-size:12px;letter-spacing:.3px;margin-bottom:6px;}
  .stat-value{font-family:var(--font-display);font-weight:600;font-size:21px;color:var(--ink);}
  .name-edit-input{
    width:100%;max-width:260px;padding:6px 10px;border:1px solid var(--namebar-field-border);border-radius:6px;
    background:var(--namebar-field-bg);color:var(--namebar-ink);font-family:var(--font-display);font-weight:600;font-size:17px;
  }
  .name-edit-input:focus{outline:2px solid var(--accent);outline-offset:1px;}

  /* 展開時的細微動畫：只套用在教師卡片展開的內容，避免薪資表格每次重繪都跟著閃一下 */
  @keyframes teacherBodyIn{
    from{opacity:0;transform:translateY(-4px);}
    to{opacity:1;transform:translateY(0);}
  }
  .teacher-body{animation:teacherBodyIn .16s ease-out;}

  /* 滑鼠移過老師名條時的細微回饋：底色微亮 + 右移一點點 */
  .name-bar{transition:background-color .16s ease, transform .16s ease;}
  .bar-card .name-bar:hover{background:var(--namebar-hover);}
  .bar-card .name-bar:hover .name-bar-name{transform:translateX(2px);}
  .name-bar-name{transition:transform .16s ease;}
  .bar-card .name-bar.inactive:hover{background:var(--namebar-hover-inactive);}
  /* 展開/收合小箭頭轉一下，讓狀態切換更明確 */
  .expand-caret{display:inline-block;transition:transform .16s ease;}

  @media (prefers-reduced-motion: reduce){
    .teacher-body{animation:none;}
    .name-bar, .name-bar-name, .expand-caret{transition:none;}
  }


  /* ===== 員工薪資：合計區塊（用不同色塊與下方員工卡片明顯分開） ===== */
  .summary-band{
    background:linear-gradient(180deg, var(--summary-bg-1), var(--summary-bg-2));
    border:1px solid var(--summary-border);
    border-radius:12px;padding:18px 20px;margin:6px 0 30px;
  }
  .summary-title{
    font-family:var(--font-display);font-weight:600;font-size:15px;
    color:var(--summary-ink);margin-bottom:14px;letter-spacing:.3px;
  }
  .summary-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}
  @media(max-width:820px){ .summary-grid{grid-template-columns:repeat(2,1fr);} }
  @media(max-width:420px){ .summary-grid{grid-template-columns:1fr 1fr;} }
  .summary-item{
    background:var(--summary-item-bg);border:1px solid var(--summary-item-border);
    border-radius:9px;padding:12px 14px;
  }
  .summary-item.total{ background:var(--summary-total-bg);border-color:var(--summary-total-border); }
  .summary-label{font-size:11.5px;color:var(--summary-label);letter-spacing:.3px;margin-bottom:6px;font-weight:600;}
  .summary-value{font-family:var(--font-display);font-weight:600;font-size:19px;color:var(--summary-ink);}
  .summary-item.total .summary-value{color:var(--summary-total-ink);}

  /* 各員工明細的分隔標題 */
  .staff-section-label{
    font-family:var(--font-display);font-weight:600;font-size:15px;color:var(--ink);
    margin:0 0 12px;padding-left:2px;letter-spacing:.3px;
  }
  .staff-card{border-left:4px solid var(--staff-accent);}
  /* 各員工明細用不同色系的左側色條與標題色，方便一眼分辨是誰的區塊 */
  .staff-card.tone-1{--staff-accent:var(--tone-1);}
  .staff-card.tone-2{--staff-accent:var(--tone-2);}
  .staff-card.tone-3{--staff-accent:var(--tone-3);}
  .staff-card.tone-4{--staff-accent:var(--tone-4);}
  .staff-card.tone-5{--staff-accent:var(--tone-5);}
  .staff-card .card-title{color:var(--staff-accent);}
  .staff-card .staff-total-row.grand{
    border-color:var(--staff-accent);
    background:color-mix(in srgb, var(--staff-accent) 12%, transparent);
  }
  .staff-card .staff-total-row.grand span{color:var(--staff-accent);}

  /* 每位員工的結算小結 */
  .staff-total{
    margin-top:16px;padding:14px 16px;border-radius:9px;
    background:var(--staff-total-bg);border:1px solid var(--staff-total-border);
  }
  .staff-total-row{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;padding:4px 0;color:var(--ink);}
  .staff-total-row .num{font-family:var(--font-mono);}
  .staff-total-row.grand{
    margin-top:8px;padding-top:10px;border-top:1px solid var(--staff-total-border);
    font-weight:700;font-size:15px;color:var(--staff-total-ink);
  }
  .staff-total-row.grand .num{font-size:17px;}

  /* 獎金區塊 */
  .bonus-block{
    margin-top:16px;padding:14px 16px;border-radius:9px;
    background:var(--bonus-bg);border:1px dashed var(--bonus-border);
  }
  .bonus-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .bonus-title{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13.5px;color:var(--ink);}
  .bonus-title .title-icon svg{width:15px;height:15px;}
  .bonus-empty{font-size:12.5px;color:var(--ink-soft);padding:8px 0;}
  .bonus-table{margin-bottom:10px;}
  .bonus-add{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-top:10px;}


  .time-picker{display:flex;align-items:center;gap:6px;}
  .time-picker select{flex:1;min-width:0;text-align:center;text-align-last:center;padding:9px 6px;font-size:14px;}
  .time-colon{font-weight:700;color:var(--ink-soft);font-family:var(--font-mono);}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .table-scroll table{min-width:640px;}

  .bar-card{padding:0 !important;overflow:hidden;}
  /* buildTeacherAppCard() 借用 bar-card 只是為了 teacher-toned 的色條/配色，
     不是 name-bar 那種收合卡片，所以要自己把 padding:0 補回來，不然文字會貼在邊框上 */
  .bar-card.slip-card{padding:20px 22px !important;overflow:visible;}
  /* 收合中的明細：畫面上隱藏，但仍留在 DOM 裡，列印與即時計算才拿得到 */
  .card-body.collapsed{display:none;}
  .name-bar{background:var(--namebar-bg);color:var(--namebar-ink);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--namebar-line);}
  .name-bar.inactive{background:var(--namebar-bg-inactive);}
  .name-bar-name{font-family:var(--font-display);font-weight:600;font-size:18px;}
  /* 薪資總覽的老師名條：左側細色條 + 名字著色，用色相環區分每位老師 */
  .name-bar.teacher-tinted{
    background:color-mix(in srgb, var(--tint) 8%, var(--namebar-bg));
  }
  .bar-card .name-bar.teacher-tinted:hover{
    background:color-mix(in srgb, var(--tint) 15%, var(--namebar-bg));
  }
  /* 教師設定的老師卡片：每位老師一個顏色，直接取主題自帶的 --tone-1~5，
     所以跟櫃檯薪資卡、主視覺是同一套日式色系（蘇芳／藍／綠／金茶／紫），
     三個主題各有自己的明暗版本，深色後台與列印都不用另外調。
     停用中的老師不上色，維持灰階，一眼就能跟啟用中的區分開。 */
  .bar-card.teacher-toned{border-left:4px solid var(--tint);}
  .bar-card.teacher-toned .name-bar{background:color-mix(in srgb, var(--tint) 10%, var(--namebar-bg));}
  .bar-card.teacher-toned .name-bar:hover{background:color-mix(in srgb, var(--tint) 18%, var(--namebar-bg));}
  .bar-card.teacher-toned .name-bar-name{color:var(--tint);}
  .bar-card.teacher-toned .info-label{color:color-mix(in srgb, var(--tint) 70%, var(--ink-soft));}
  .card-body{padding:18px 22px;}

  .info-block{margin-bottom:14px;}
  .info-label{font-size:11.5px;font-weight:700;letter-spacing:.5px;color:var(--ink-soft);text-transform:uppercase;margin-bottom:6px;}
  .info-value-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .info-value-row select{max-width:180px;}
  .info-hint{font-size:12.5px;color:var(--ink-soft);white-space:nowrap;}
  .info-divider{height:1px;background:var(--border);margin:14px 0;}

  /* 跟 no-print 相反：平常隱藏，只有列印時才顯示（信頭、頁尾、專門給紙本看的明細都用這個） */
  .print-only{display:none;}

  /* ===== 列印文件的信頭／頁尾（v3.9）=====
     三份會輸出成 PDF 的頁面（薪資總覽、員工薪資、老師薪資單）共用同一套視覺語言：
     小字 BBS Studio 品牌標記（斜體 Fraunces，跟登入頁的品牌字體呼應）+ 文件標題 + 期間／匯出時間，
     底部再收一條極淡的頁尾，讓每一份印出來的紙本都看得出是同一套系統做的，不是三種風格拼起來的。
     平常在畫面上不顯示（跟畫面上原本就有的標題重複），只有列印/另存 PDF 時才出現。 */
  .print-letterhead{margin-bottom:24px;padding-bottom:16px;border-bottom:2px solid var(--ink);}
  .print-brand{font-family:var(--font-display);font-style:italic;font-weight:600;font-size:14px;letter-spacing:.2px;color:var(--accent);margin-bottom:3px;}
  .print-doctitle{font-family:var(--font-display);font-weight:600;font-size:25px;color:var(--ink);line-height:1.25;}
  .print-meta{font-size:11.5px;color:var(--ink-soft);margin-top:5px;letter-spacing:.1px;}
  .print-footer{margin-top:28px;padding-top:12px;border-top:1px solid var(--border);font-size:9.5px;color:var(--ink-soft);text-align:center;letter-spacing:.2px;}

  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px;}
  @media(max-width:800px){.kpi-grid{grid-template-columns:repeat(2,1fr);}}
  .kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 14px;}
  .kpi-label{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;}
  .kpi-value{font-family:var(--font-mono);font-size:19px;font-weight:600;color:var(--ink);}

  .payslip{background:var(--slip-bg);color:var(--slip-ink);border:1px solid var(--slip-border);border-radius:10px;padding:36px;max-width:720px;margin:0 auto;box-shadow:0 1px 3px var(--slip-shadow);}
  .payslip h2{font-family:var(--font-display);font-weight:600;font-size:25px;margin:0 0 8px;color:var(--slip-ink);line-height:1.25;}
  .payslip .meta{display:flex;justify-content:space-between;color:var(--slip-ink-mid);font-size:13px;margin-bottom:18px;border-bottom:1px solid var(--slip-border);padding-bottom:14px;}
  .payslip table{font-size:13px;width:100%;border-collapse:collapse;}
  .payslip th{color:var(--slip-ink-mid);border-bottom:1px solid var(--slip-line-strong);padding:8px 7px;font-weight:600;white-space:nowrap;letter-spacing:0;text-transform:none;font-size:12px;}
  .payslip td{border-bottom:1px solid var(--slip-line);color:var(--slip-ink);padding:9px 7px;line-height:1.6;}
  /* 該黏在一起的內容就不要斷行：日期（含星期）、金額、人名 */
  .payslip .nw{white-space:nowrap;}
  .payslip .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .payslip .total-row td{font-weight:700;font-family:var(--font-mono);font-size:15px;border-top:2px solid var(--slip-ink);border-bottom:none;padding-top:12px;}
  /* 薪資單依課程性質分區：類別標頭列 + 每區小計 */
  .payslip .slip-group-row td{
    font-weight:700;font-size:12.5px;letter-spacing:.5px;
    background:color-mix(in srgb, var(--slip-ink) 6%, transparent);
    color:var(--slip-ink);padding-top:9px;padding-bottom:9px;border-bottom:1px solid var(--slip-line-strong);
  }
  .payslip .slip-subtotal td{
    font-weight:600;font-family:var(--font-mono);color:var(--slip-ink-mid);
    border-top:1px solid var(--slip-line-strong);border-bottom:1px solid var(--slip-border);
  }
  .payslip tr{page-break-inside:avoid;}
  .payslip .slip-section{margin-top:22px;padding-top:16px;border-top:1px dashed var(--slip-border);}
  .payslip .slip-section-title{font-size:12px;color:var(--slip-ink-mid);margin-bottom:10px;font-weight:600;}

  /* 老師薪資「一般畫面顯示」樣式：彈性排版、不用固定欄位表格，手機上不會被擠爆。
     跟系統其他頁面同一套視覺語言（卡片、tone 色條、staff-total-row 的合計列樣式）。 */
  .slip-app-section-title{font-size:12.5px;font-weight:600;color:var(--ink-soft);margin:14px 0 6px;letter-spacing:.2px;}
  .slip-app-row{padding:8px 0;border-bottom:1px solid var(--border);}
  .slip-app-row:last-child{border-bottom:none;}
  .slip-app-row-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13.5px;flex-wrap:wrap;}
  .slip-app-course{flex:1;min-width:0;color:var(--ink);font-weight:500;}
  .slip-app-sub{font-weight:600;color:var(--ink);white-space:nowrap;}
  .slip-app-row-bits{font-size:11.5px;color:var(--ink-soft);margin-top:2px;line-height:1.6;}

  @media print{
    body *{visibility:hidden;}
    .printable, .printable *{visibility:visible;}
    .printable{position:absolute;top:0;left:0;width:100%;}
    .no-print{display:none !important;}
    /* 平常隱藏，只有列印/另存 PDF 時才出現，跟 no-print 剛好相反 */
    .print-only{display:block !important;}
    /* 列印時所有明細一律展開，不受畫面上的收合影響 */
    .card-body.collapsed{display:block !important;}

    /* 後台是深色的，但紙張是白的：列印時整組色票換回淺色，
       避免淺色文字印在白紙上變成看不見。文字一律用最深的墨色。 */
    .theme-owner{
      color-scheme: light;
      --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F4F1E9;
      --ink:#1C1A18; --ink-soft:#4A453D;
      --accent:#8C3436; --accent-ink:#FFFFFF; --accent-2:#165E83;
      --border:#C9C2B4; --danger:#9B2F2B; --success:#2A5A3B;
      --locked-bg:#F4F1E9;
      --pill-group-bg:#8C343614;   --pill-group-fg:#7A2C2E;
      --pill-trial-bg:#7E571114;   --pill-trial-fg:#6B490D;
      --pill-individual-bg:#2A5A3B14; --pill-individual-fg:#234C32;
      --pill-muted-bg:#00000012;
      --summary-bg-1:#F4F1E9; --summary-bg-2:#EEEADF; --summary-border:#C9C2B4;
      --summary-ink:#1C1A18; --summary-label:#4A453D;
      --summary-item-bg:#FFFFFF; --summary-item-border:#D2CABA;
      --summary-total-bg:#FFFFFF; --summary-total-border:#8C343688; --summary-total-ink:#7A2C2E;
      --staff-accent:#8C343688;
      --staff-total-bg:#F4F1E9; --staff-total-border:#D2CABA; --staff-total-ink:#7A2C2E;
      --bonus-bg:#FFFFFF; --bonus-border:#8C863F66;
      --namebar-bg:#EFE9DA; --namebar-bg-inactive:#E9E5D9; --namebar-hover:#EFE9DA; --namebar-hover-inactive:#E9E5D9;
      --namebar-ink:#1C1A18; --namebar-ink-soft:#4A453D; --namebar-line:#00000022;
      --namebar-field-bg:#FFFFFF; --namebar-field-border:#1C1A1840;
      --namebar-danger:#7A2C2E; --namebar-danger-border:#7A2C2E66; --namebar-pill-bg:#1C1A1814;
      --slip-bg:#FFFFFF; --slip-ink:#1C1A18; --slip-ink-mid:#4A453D; --slip-ink-soft:#5C564C;
      --slip-border:#C9C2B4; --slip-line:#DCD6C8; --slip-line-strong:#C9C2B4; --slip-shadow:transparent;
      --pill-subin-bg:#165E8314;  --pill-subin-fg:#12506F;
      --pill-subout-bg:#5B4A8A14; --pill-subout-fg:#4E3F78;
      --tone-1:#8C3436; --tone-2:#12506F; --tone-3:#234C32; --tone-4:#6B490D; --tone-5:#4E3F78;
    }
    /* 前台是淺色的，但底色仍略帶米黃，列印時一併壓成純白省墨水 */
    .theme-front{
      --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F4F1E9;
      --ink:#1C1A18; --ink-soft:#4A453D;
      --slip-bg:#FFFFFF; --slip-ink:#1C1A18; --slip-ink-mid:#4A453D; --slip-ink-soft:#5C564C;
      --slip-shadow:transparent;
    }
    .payslip{border:none !important;box-shadow:none !important;max-width:none !important;width:100% !important;padding:0 !important;}
    .payslip table{font-size:11.5px;}
    .payslip th{font-size:11px;padding:6px 5px;}
    .payslip td{padding:7px 5px;}
    thead{display:table-header-group;}
    /* 分頁控制：卡片盡量整塊留在同一頁，類別標頭不會孤零零留在頁尾、內容卻被推到下一頁 */
    .kpi-card, .staff-card, .summary-item{page-break-inside:avoid;}
    .detail-group-row, .slip-group-row{page-break-after:avoid;}
  }
  @page{ margin:14mm 12mm; }
  .login-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  /* 深木底上的一張紙：加一點陰影讓卡片浮起來 */
  .login-shell .card{box-shadow:0 10px 30px rgba(0,0,0,.35);}
  /* 卡片外若有任何文字，落在深木底上要用亮色；卡片內則維持墨色 */
  .theme-login .login-shell{color:#F5F1E8;}
  .theme-login .login-shell .card{color:var(--ink);}

  /* 需要匯出成 PDF／圖片、但平常不需要出現在畫面上的紙本內容都掛這個 class。
     用「移到畫面外」而不是 display:none，是因為 display:none 的元素列印時也會被跳過，
     另存圖片時 html2canvas 也抓不到；移到畫面外仍然有真正的版面配置，截圖／列印都抓得到，
     只是使用者平常看不見。用共用 class（不是單一 id），這樣不同分頁各自的匯出容器不會互相撞名。 */
  /* 這條只能限定在「螢幕上」生效！如果不限定，列印的時候這條規則跟 .printable 的
     print 專用規則（把內容定位回頁面上）同時符合、優先權又打平，會照原始碼順序判定，
     結果變成離屏定位贏了，印出來整頁空白——這是真的踩過的坑，不要拿掉這個 @media screen。 */
  @media screen{
    .export-doc{position:absolute;left:-9999px;top:0;width:800px;}
  }

  .card{overflow-x:auto;}

  @media (min-width:641px) and (max-width:900px){
    .grid3{grid-template-columns:1fr 1fr;}
    .wrap{max-width:100%;padding:0 16px;}
  }

  @media(max-width:600px){
    .wrap{padding:0 12px;}
    .card{padding:16px;}
    .card-body{padding:14px 16px;}
    .name-bar{padding:12px 14px;}
    h2.section-title{font-size:18px;margin:22px 0 4px;}
    .brand h1{font-size:19px;}
    .topbar{padding:12px 0;}
    .topbar-inner{gap:8px;}
    .userbox{gap:8px;width:100%;justify-content:space-between;}
    .modeswitch button{padding:6px 10px;font-size:12px;}
    /* 分頁選單改成單行水平捲動，不要換行——不然選單自己佔兩行、把內容往下擠 */
    .tabs{gap:4px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;}
    .tabs button{padding:8px 10px;font-size:12.5px;white-space:nowrap;flex:none;}
    .kpi-grid{grid-template-columns:repeat(2,1fr);gap:8px;}
    table{font-size:12px;}
    th, td{padding:7px 4px;}

  // ---------- Firebase Firestore (via REST API + fetch, no SDK needed) ----------
  const firebaseConfig = {
    apiKey: "AIzaSyBZXukibGiiM5seo7MUh2s_h5d7C3Wn9k0",
    authDomain: "bbs-studio.firebaseapp.com",
    projectId: "bbs-studio",
    storageBucket: "bbs-studio.firebasestorage.app",
    messagingSenderId: "817808937408",

  };
  // 測試環境：collection 名稱改成 appData_test，跟正式站的 appData 完全隔開，

  const FIRESTORE_COLLECTION = 'appData_test';
  const FIRESTORE_BASE = `https://firestore.googleapis.com/v1/projects/${firebaseConfig.projectId}/databases/(default)/documents/${FIRESTORE_COLLECTION}`;

  // 優先嘗試用 Firebase 官方 SDK（如果這個頁面環境允許載入的話），這樣才有正式支援的連線方式；

  // ===== Firebase Authentication（v3.0 資安改造）=====

  const AUTH_EMAIL_DOMAIN = 'bbs-studio.local';
  const MIN_PASSWORD_LEN = 6;   // Firebase Auth 的硬性下限，比舊制的 4 碼安全
  function emailOf(username){ return String(username||'').trim().toLowerCase() + '@' + AUTH_EMAIL_DOMAIN; }
  function usernameFromEmail(email){ return String(email||'').split('@')[0]; }

  let fbAuth = null;              // 主要的 Auth 實例

  // 把登入憑證附在 Firestore REST 請求上（用官方 SDK 時它會自己帶）
  async function authHeader(){
    if(!fbAuth || !fbAuth.currentUser) return {};

  // 建立 Auth 帳號時如果用主實例，Firebase 會自動把「目前登入者」換成新建的那個帳號，

  function getSecondaryAuth(){

  // ===== 權限層級（v3.1）=====
  // 內部代號用 boss，避免跟畫面模式的 mode==='owner'（後台）搞混。
  //   經營者 boss       ：全部，含系統設定（費率、帳號、危險區域、批次校正）
  //   系統管理者 admin  ：前台＋後台＋系統設定（目前與經營者同權，僅頭銜不同）
  //   主管   supervisor ：只有前台，但可以幫別人登記／修改（代管）

  const ROLE_LABEL = { boss:'經營者', admin:'系統管理者', supervisor:'主管', frontdesk:'櫃檯' };
  const ROLE_RANK  = { boss:4, admin:3, supervisor:2, frontdesk:1 };
  const ROLE_HINT  = {
    boss:'全部權限，最高層級',
    admin:'前台＋後台，含系統設定',
    supervisor:'僅前台，可代其他人登記與修改',
    frontdesk:'僅前台，只能登記與修改自己的紀錄'
  };
  function roleOf(){ return (currentUser && currentUser.role) || 'frontdesk'; }
  function roleRank(r){ return ROLE_RANK[r] || 0; }
  function roleLabel(r){ return ROLE_LABEL[r] || '櫃檯'; }
  // 能進後台（薪資總覽、老師薪資、員工薪資、代課紀錄、課程設定）
  function canBackstage(){ return roleRank(roleOf()) >= ROLE_RANK.admin; }
  // 能開系統設定（地區費率、時薪、帳號管理、備份還原、批次校正）
  function canManageSystem(){ return roleRank(roleOf()) >= ROLE_RANK.admin; }
  // 能代其他人登記／修改別人的紀錄（前台的代管能力）
  function canManageOthers(){ return roleRank(roleOf()) >= ROLE_RANK.supervisor; }
  // 帳號清單裡還有幾位「啟用中的經營者」——用來擋掉把自己鎖在門外
  function activeBossCount(exceptId){

  let pollTimer = null;

  let lastSeen = { settings:'', teachers:'', entries:'', shifts:'', bonuses:'' };

  let pendingRender = false;

  function toFirestoreValue(v){
    if(v===null || v===undefined) return { nullValue: null };
    if(typeof v==='string') return { stringValue: v };
    if(typeof v==='boolean') return { booleanValue: v };
    if(typeof v==='number') return Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v };
    if(Array.isArray(v)) return { arrayValue: { values: v.map(toFirestoreValue) } };
    if(typeof v==='object') return { mapValue: { fields: Object.fromEntries(Object.entries(v).map(([k,val])=>[k, toFirestoreValue(val)])) } };
    return { stringValue: String(v) };
  }
  function fromFirestoreValue(fv){
    if(!fv) return null;
    if('nullValue' in fv) return null;
    if('stringValue' in fv) return fv.stringValue;
    if('booleanValue' in fv) return fv.booleanValue;
    if('integerValue' in fv) return Number(fv.integerValue);
    if('doubleValue' in fv) return fv.doubleValue;
    if('arrayValue' in fv) return (fv.arrayValue.values||[]).map(fromFirestoreValue);
    if('mapValue' in fv){
      const obj = {};
      const fields = fv.mapValue.fields || {};
      Object.keys(fields).forEach(k=>{ obj[k] = fromFirestoreValue(fields[k]); });
      return obj;
    }
    return null;
  }
  function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }
  async function fetchWithRetry(url, options, attempts){
    attempts = attempts || 3;
    let lastErr = null;
    for(let i=0;i<attempts;i++){
      try{
        const res = await fetch(url, options);
        return res;
      }catch(e){
        lastErr = e;
        if(i<attempts-1) await sleep(400 * (i+1));
      }
    }
    throw lastErr;
  }
  async function fetchDoc(docId){
    if(useSDK){
      const doc = await sdkDb.collection(FIRESTORE_COLLECTION).doc(docId).get();
      return doc.exists ? doc.data().value : null;
    }
    const url = `${FIRESTORE_BASE}/${docId}?key=${firebaseConfig.apiKey}`;
    const res = await fetchWithRetry(url, { headers: await authHeader() });
    if(res.status===404) return null;
    if(!res.ok){ throw new Error('Firestore 讀取失敗 ('+res.status+')：'+(await res.text())); }
    const data = await res.json();
    const fields = data.fields || {};
    return fields.value ? fromFirestoreValue(fields.value) : null;
  }
  async function writeDoc(docId, value){
    if(useSDK){
      await sdkDb.collection(FIRESTORE_COLLECTION).doc(docId).set({ value, updatedAt: new Date().toISOString() });
      return;
    }
    const url = `${FIRESTORE_BASE}/${docId}?key=${firebaseConfig.apiKey}`;
    const body = { fields: { value: toFirestoreValue(value), updatedAt: { stringValue: new Date().toISOString() } } };
    const res = await fetchWithRetry(url, { method:'PATCH',
      headers: Object.assign({'Content-Type':'application/json'}, await authHeader()),
      body: JSON.stringify(body) });
    if(!res.ok){ throw new Error('Firestore 寫入失敗 ('+res.status+')：'+(await res.text())); }
  }


  // ===== 舊角色遷移（v3.1）=====
  // v3.0 以前只有 admin／frontdesk 兩級。分成四級之後，若直接把 admin 當成新的「管理者」，
  // 原本的老闆帳號會突然進不了系統設定，等於被鎖在門外。
  // 所以一律先升成「經營者」保住既有權限，再由本人到帳號管理手動降級成系統管理者／主管。
  function migrateLegacyRoles(){
    const accounts = (settings && settings.accounts) ? settings.accounts : [];
    if(accounts.length === 0) return false;
    if(accounts.some(a=>a.role === 'boss')) return false;   // 已經遷移過了
    let n = 0;
    accounts.forEach(a=>{
      if(a.role === 'admin'){ a.role = 'boss'; n++; }
      else if(!ROLE_LABEL[a.role]){ a.role = 'frontdesk'; }
    });
    if(n === 0) return false;
    logAction('權限層級升級', 'v3.1', '舊制「管理者」' + n + ' 位自動升為經營者，可自行調整為系統管理者／主管');
    return true;
  }

  // ===== Google 登入（v3.2）=====
  // 為什麼改用 Google：合成 email 收不到重設信，忘記密碼只能砍掉重建。
  // 交給 Google 之後，密碼由 Google 保管，忘記密碼是他自己的事，我們完全不用管。
  //
  // ⚠ 重要：一旦在 Firebase 開啟 Google 登入，全世界任何 Google 帳號都能通過
  // 「request.auth != null」這條規則。所以必須另外維護一份 roster 白名單，
  // 讓 Firestore 規則比對「這個 email 是不是我們的員工」，否則資料等於公開。
  function normEmail(v){ return String(v||'').trim().toLowerCase(); }
  function isSyntheticEmail(v){ return normEmail(v).endsWith('@' + AUTH_EMAIL_DOMAIN); }

  // 白名單＝所有啟用中帳號的 Google email ＋ 舊制密碼登入用的合成 email
  function rosterEmails(){
    const set = {};
    (settings && settings.accounts ? settings.accounts : []).forEach(a=>{
      if(!a.active) return;
      if(a.email) set[normEmail(a.email)] = 1;
      set[emailOf(a.username)] = 1;
    });
    return Object.keys(set).sort();
  }
  async function syncRoster(){
    try{ await writeDoc('roster', rosterEmails()); }
    catch(e){ console.error('roster 名單同步失敗', e); }
  }

  function isGoogleSession(){
    return !!(fbAuth && fbAuth.currentUser
      && (fbAuth.currentUser.providerData||[]).some(p=>p && p.providerId === 'google.com'));
  }

  function googleProvider(){
    const p = new firebase.auth.GoogleAuthProvider();
    p.setCustomParameters({ prompt: 'select_account' });   // 每次都讓他挑帳號，共用電腦不會沿用上一個人
    return p;
  }

  async function doGoogleLogin(){
    if(!fbAuth) throw new Error('Firebase Auth 未載入，請檢查網路後重新整理。');
    let result;
    try{
      result = await fbAuth.signInWithPopup(googleProvider());
    }catch(e){
      const code = (e && e.code) || '';
      if(code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request'){
        throw new Error('登入視窗被關閉了，請再試一次。');
      }
      // 有些手機瀏覽器會擋彈出視窗，改用整頁跳轉（會離開這一頁，回來時由 onAuthStateChanged 接手）
      if(code === 'auth/popup-blocked' || code === 'auth/operation-not-supported-in-this-environment'){
        await fbAuth.signInWithRedirect(googleProvider());
        return;
      }
      throw new Error(authErrorText(e));
    }
    await afterGoogleLogin(result.user);
  }

  async function afterGoogleLogin(user){
    const email = normEmail(user && user.email);
    await loadAll();
    const acc = (settings.accounts||[]).find(a=> a.email && normEmail(a.email) === email);
    if(!acc){
      try{ await fbAuth.signOut(); }catch(e){}
      throw new Error('這個 Google 帳號（' + email + '）還沒有綁定系統帳號。\n\n'
        + '請聯絡經營者，到「系統設定 → 帳號管理」把這個 email 填進你的帳號裡。');
    }
    if(!acc.active){
      try{ await fbAuth.signOut(); }catch(e){}
      throw new Error('此帳號已被停用。');
    }
    currentUser = { username: acc.username, role: acc.role, email: email };
  }

  // ===== 登入流程（v3.0）=====
  // 順序：先試 Firebase Auth → 失敗才回頭比對舊的明文密碼 → 比對成功就當場自動遷移。
  // 所以現有帳號不需要任何手動動作，每個人下次登入時就自動搬家了。
  async function afterAuthLogin(username){
    await loadAll();
    const acc = (settings.accounts||[]).find(a=>a.username===username);
    if(!acc){ try{ await fbAuth.signOut(); }catch(e){} throw new Error('這個帳號在系統中不存在，請聯絡系統管理者。'); }
    if(!acc.active){ try{ await fbAuth.signOut(); }catch(e){} throw new Error('此帳號已被停用。'); }
    currentUser = { username: acc.username, role: acc.role };
    // 遷移完成，把 Firestore 裡的明文密碼清掉
    if(acc.password){
      delete acc.password;
      acc.authMigratedAt = new Date().toISOString();
      logAction('帳號資安遷移', acc.username, '密碼已改由 Firebase Auth 保管，明文密碼已清除');
      await saveSettings();
    }
  }

  async function doLogin(u, p){
    // 1) 先走 Firebase Auth（已遷移的帳號會走這條）
    if(fbAuth){
      try{
        await fbAuth.signInWithEmailAndPassword(emailOf(u), p);
        await afterAuthLogin(u);
        return;
      }catch(e){
        const code = (e && e.code) || '';
        const maybeLegacy = ['auth/user-not-found','auth/invalid-credential',
                             'auth/invalid-login-credentials','auth/wrong-password'].indexOf(code) >= 0;
        if(!maybeLegacy) throw new Error(authErrorText(e));
        // 否則落下去用舊制驗證
      }
    }
    // 2) 舊制明文驗證（只有尚未遷移的帳號會走到這裡）
    if(!settings || !settings.accounts) await loadAll();
    const acc = (settings.accounts||[]).find(a=>a.username===u && a.password===p && a.active);
    if(!acc) throw new Error('帳號或密碼錯誤，或此帳號已被停用。');

    if(!fbAuth){
      // Auth SDK 沒載入成功（例如被網路擋住），退回舊制讓人還是能用系統
      currentUser = { username: acc.username, role: acc.role, legacy: true };
      await loadAll();
      return;
    }
    // 3) 自動遷移
    if(p.length >= MIN_PASSWORD_LEN){
      await createAuthUser(u, p);
      await fbAuth.signInWithEmailAndPassword(emailOf(u), p);
      await afterAuthLogin(u);
    }else{
      // 舊密碼不足 6 碼，Firebase 不收，請使用者當場設一組新的
      migrateTarget = { username: u };
      throw new Error('__NEED_NEW_PASSWORD__');
    }
  }

  async function autoBackupIfNeeded(){
    try{
      const today = new Date().toISOString().slice(0,10);
      const backupId = 'backup_' + today;
      const existing = await fetchDoc(backupId);
      if(!existing){
        await writeDoc(backupId, { teachers, entries, settings, shifts, bonuses, backedUpAt: new Date().toISOString() });
      }
    }catch(e){ /* 自動備份失敗不影響主流程，安靜略過，下次載入會再嘗試 */ }

  // 已取消每 8 秒的自動輪詢：在手機上登記到一半時，背景重繪會把表單清掉。
  // 現在改成「手動重新整理」＋「切換分頁／視窗重新聚焦時才更新」，登記過程中畫面不會自己跳動。
  function startPolling(){
    if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
  }
  function updateSyncIndicator(){
    const el = document.getElementById('syncIndicator');
    if(!el) return;
    if(!syncOk){
      el.textContent = '⚠ 連線不穩';
      el.style.color = 'var(--danger)';
    } else if(pendingRender){
      el.textContent = '● 有新資料，可按重新整理';
      el.style.color = 'var(--accent)';
    } else {
      el.textContent = '';
      el.style.color = '';
    }
  }
  async function pollOnce(){
    try{
      const [s, t, e3, sh, bn] = await Promise.all([fetchDoc('settings'), fetchDoc('teachers'), fetchDoc('entries'), fetchDoc('shifts'), fetchDoc('bonuses')]);
      let changed = false;
      if(s){ const str = JSON.stringify(s); if(str!==lastSeen.settings){ settings = s; lastSeen.settings = str; changed = true; } }
      if(t){ const str = JSON.stringify(t); if(str!==lastSeen.teachers){ teachers = t; lastSeen.teachers = str; changed = true; } }
      if(e3){ const str = JSON.stringify(e3); if(str!==lastSeen.entries){ entries = e3; lastSeen.entries = str; changed = true; } }
      if(sh){ const str = JSON.stringify(sh); if(str!==lastSeen.shifts){ shifts = sh; lastSeen.shifts = str; changed = true; } }
      if(bn){ const str = JSON.stringify(bn); if(str!==lastSeen.bonuses){ bonuses = bn; lastSeen.bonuses = str; changed = true; } }
      lastRefreshedAt = new Date();
      syncOk = true;
      if(changed){
        // 只有在使用者沒有正在填表時才直接重繪；否則先擱著，等他自己按「重新整理」
        if(hasUnsavedFormInput()){ pendingRender = true; updateSyncIndicator(); }
        else { render(); }
      } else {
        updateSyncIndicator();
      }
    }catch(e){
      syncOk = false;
      updateSyncIndicator();
      // 暫時性網路問題：不跳錯誤視窗，等使用者切回分頁或按「重新整理」時再試
    }
  }

  // 判斷畫面上是否有「填到一半」的表單內容。
  // 手機上點下拉選單時焦點會離開欄位，光看 focus 不夠可靠，所以直接檢查欄位裡有沒有值。
  const FORM_FIELD_IDS = [
    's_staff','s_date','s_startH','s_startM','s_endH','s_endM','s_note',   // 上班時數登記
    'f_teacher','f_course','f_courseManual','f_attendance','f_substituteName','f_note', // 每日課程登記
    't_name','t_course'                                                    // 新增老師
  ];
  function hasUnsavedFormInput(){
    // 正在編輯既有紀錄時也算「填表中」
    if(editingId || editingShiftId || editingTeacherId || editingBonusId || editingStaffRateId || editingRegionId || editingAccountId || editingManualId) return true;
    for(const id of FORM_FIELD_IDS){
      const el = document.getElementById(id);
      if(!el) continue;
      const v = (el.value||'').trim();
      if(!v) continue;
      // 日期欄位預設就是今天，不算使用者填的內容
      if(id==='s_date' || id==='f_date') continue;
      return true;
    }
    // 焦點還停在輸入元件上也算
    const active = document.activeElement;
    if(active && ['INPUT','SELECT','TEXTAREA'].includes(active.tagName)) return true;
    return false;
  }


  // 從其他 App／分頁切回來時，若沒有填到一半才靜靜同步一次（不會在登記過程中打斷）
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible' && !hasUnsavedFormInput()){
      pollOnce();
    }
  });

  const DOC_LABELS = {
    settings:'系統設定', teachers:'教師資料', entries:'登記紀錄',
    shifts:'打卡紀錄', bonuses:'獎金紀錄'
  };
  async function persist(docId, value){
    // 這份資料如果一開始就沒讀成功，本機拿的是預設值或空陣列。
    // 這時候寫回雲端會把正確的資料整份蓋掉，所以一律擋下來。
    if(initialLoadFailed[docId]){
      alert('「'+(DOC_LABELS[docId]||docId)+'」這份資料先前載入失敗，\n'
        + '目前畫面上顯示的不是雲端的正確內容。\n\n'
        + '為了避免覆蓋掉正確資料，這次的變更沒有儲存。\n'
        + '請先按上方紅色提示裡的「重新載入」，成功之後再操作一次。');
      return;
    }
    try{
      await writeDoc(docId, value);
      lastSeen[docId] = JSON.stringify(value);
    }catch(e){ console.error('儲存失敗', docId, e); alert('資料儲存失敗，請檢查網路連線後再試一次。'); }
  }
  function saveTeachers(){ persist('teachers', teachers); }

  // ===== 操作紀錄 =====
  // 記下「誰、什麼時候、對什麼、做了什麼」。log 寫入失敗不能連累原本的操作，
  // 所以包在自己的 try 裡、獨立寫入，就算失敗也只是這筆沒記到。
  function logAction(action, target, detail){
    try{
      const entry = {
        id: uid(),
        at: new Date().toISOString(),
        who: (currentUser && currentUser.username) ? currentUser.username : '(未登入)',
        action: action || '',
        target: target || '',
        detail: detail || ''
      };
      auditLog.push(entry);
      // 滾動保留最近 AUDIT_MAX 筆，超過就丟最舊的，避免文件無限長大
      if(auditLog.length > AUDIT_MAX) auditLog = auditLog.slice(auditLog.length - AUDIT_MAX);
      // 直接寫入，不經過 persist 的「載入失敗鎖寫入」檢查——記帳失敗不該擋住正事
      writeDoc('auditLog', auditLog).catch(err=> console.error('操作紀錄寫入失敗', err));
    }catch(err){ console.error('操作紀錄產生失敗', err); }
  }
  // 產生「A→B」的變更描述，只列出真的有變的欄位
  function diffText(before, after, fields){
    const parts = [];
    fields.forEach(f=>{
      const b = before ? before[f.key] : undefined;
      const a = after ? after[f.key] : undefined;
      if(String(b ?? '') !== String(a ?? '')){
        const fmt = f.fmt || (v=> (v===undefined||v===null||v==='') ? '（空）' : v);
        parts.push(f.label + ' ' + fmt(b) + '→' + fmt(a));
      }
    });
    return parts.join('、');
  }

  // 游標是否停在輸入元件上（重繪會把使用者打到一半的內容清掉）
  function isEditingSomeField(){
    const el = document.activeElement;
    return !!(el && ['INPUT','SELECT','TEXTAREA'].includes(el.tagName));
  }

  // 本機這次連線動過的紀錄 id。存檔合併時，只有這些會用本機版本覆蓋伺服器，
  // 沒動過的一律以伺服器為準，才不會把別人剛剛的修改蓋掉。
  const locallyChangedIds = new Set();
  function markChanged(id){ if(id) locallyChangedIds.add(id); }

  // 三份「陣列型」資料共用的合併邏輯：
  //   伺服器有、本機沒有 → 補進來（除非是本機剛刪掉的）
  //   兩邊都有，但本機沒動過 → 以伺服器為準
  //   本機動過 → 保留本機版本
  async function mergeWithServer(docId, localList){
    const server = await fetchDoc(docId);
    if(!Array.isArray(server)) return { list: localList, changed: false };
    const byId = new Map(localList.map(x=>[x.id, x]));
    let changed = false;
    server.forEach(remote=>{
      if(!remote || !remote.id) return;
      if(recentlyDeletedIds.has(remote.id)) return;      // 本機剛刪掉的不要復活
      const local = byId.get(remote.id);
      if(!local){ byId.set(remote.id, remote); changed = true; return; }
      if(locallyChangedIds.has(remote.id)) return;       // 本機動過，保留本機版
      if(JSON.stringify(local) !== JSON.stringify(remote)){
        byId.set(remote.id, remote); changed = true;     // 別人改的，接受
      }
    });
    return { list: [...byId.values()], changed };
  }

  async function saveEntries(){
    try{
      const r = await mergeWithServer('entries', entries);
      entries = r.list;
      // 正在輸入框裡打字時不要重繪，否則游標和輸入到一半的內容會被清掉
      if(r.changed && !isEditingSomeField()) render();
    }catch(e){ /* 合併檢查失敗就直接存本機版本，不擋住儲存 */ }
    persist('entries', entries);
  }
  function saveSettings(){
    persist('settings', settings);
    // 帳號一有變動就同步白名單，Firestore 規則靠它判斷誰是員工
    syncRoster();
  }
  async function saveBonuses(){
    try{
      const r = await mergeWithServer('bonuses', bonuses);
      bonuses = r.list;
      if(r.changed && !isEditingSomeField()) render();
    }catch(e){ /* 合併檢查失敗就直接存本機版本 */ }
    persist('bonuses', bonuses);
  }
  async function saveShifts(){
    try{
      const r = await mergeWithServer('shifts', shifts);
      shifts = r.list;
      if(r.changed && !isEditingSomeField()) render();
    }catch(e){ /* 合併檢查失敗就直接存本機版本 */ }
    persist('shifts', shifts);
  }



  // 把 "HH:MM" 拆成 [時, 分]；空值回傳空字串，讓下拉選單顯示「請選擇」
  function splitTime(t){
    if(!t || typeof t!=='string' || !t.includes(':')) return ['',''];
    const [h, m] = t.split(':');
    return [h, m];
  }
  // 產生 00-23 小時選項
  function hourOptions(selected){
    let html = `<option value="">--</option>`;
    for(let h=0; h<24; h++){
      const v = String(h).padStart(2,'0');
      html += `<option value="${v}" ${v===selected?'selected':''}>${v}</option>`;
    }
    return html;
  }
  // 產生 15 分鐘一格的分鐘選項（00,15,30,45），比原生時間欄位好按很多
  function minuteOptions(selected){
    let html = `<option value="">--</option>`;
    for(let m=0; m<60; m+=15){
      const v = String(m).padStart(2,'0');
      html += `<option value="${v}" ${v===selected?'selected':''}>${v}</option>`;
    }
    // 如果之前存的分鐘不是 15 的倍數（例如舊資料 09:07），也要能顯示出來
    if(selected && !html.includes(`value="${selected}"`)){
      html += `<option value="${selected}" selected>${selected}</option>`;
    }
    return html;
  }
  // 從兩個下拉選單組回 "HH:MM"；任一沒選就回空字串
  function readTimeFrom(hId, mId){
    const h = (document.getElementById(hId)||{}).value || '';
    const m = (document.getElementById(mId)||{}).value || '';
    if(!h || !m) return '';
    return h + ':' + m;
  }

  // ---------- 工時 / 時薪計算 ----------
  // 把 "HH:MM" 轉成分鐘數；無效回傳 null
  function timeToMinutes(t){
    if(!t || typeof t!=='string') return null;
    const m = t.match(/^(\d{1,2}):(\d{2})$/);
    if(!m) return null;
    const h = Number(m[1]), mi = Number(m[2]);
    if(h<0 || h>23 || mi<0 || mi>59) return null;
    return h*60 + mi;
  }
  function minutesToHhmm(mins){
    const m = Math.max(0, Math.round(Number(mins)||0));
    const h = Math.floor(m/60), r = m%60;
    return h + '小時' + (r>0 ? (' ' + r + '分') : '');
  }
  // 工作分鐘數：支援跨夜（下班時間早於上班時間視為隔天）
  function shiftMinutes(sh){
    const start = timeToMinutes(sh.start);
    const end = timeToMinutes(sh.end);
    if(start===null || end===null) return 0;
    let diff = end - start;
    if(diff < 0) diff += 24*60;   // 跨夜班
    return Math.max(0, diff);
  }
  // 取得某位員工適用的時薪：個別設定優先，否則用預設時薪
  function hourlyRateFor(staffName){
    const rates = settings.staffRates || [];
    const hit = rates.find(r=> r.name === staffName);
    if(hit && Number(hit.rate) > 0) return Number(hit.rate);
    return Number(settings.defaultHourlyRate) || 210;
  }
  // 計薪小時數：一律用實際分鐘數精算（不做無條件捨去）
  function payableHours(mins){
    return mins / 60;
  }
  // 單筆班別薪資（四捨五入到元）
  function shiftPay(sh){
    const mins = shiftMinutes(sh);
    const rate = (sh.rateOverride!==null && sh.rateOverride!==undefined && Number(sh.rateOverride)>0)
      ? Number(sh.rateOverride)
      : hourlyRateFor(sh.staff);
    return Math.round(payableHours(mins) * rate);
  }
  // 取得某位員工在某月份的所有獎金紀錄
  function bonusesFor(staffName, ym){
    return (bonuses||[]).filter(b=> b.staff===staffName && b.month===ym);
  }
  // 某位員工某月份的獎金總額
  function bonusTotalFor(staffName, ym){
    return bonusesFor(staffName, ym).reduce((a,b)=> a + (Number(b.amount)||0), 0);
  }
  function monthShifts(ym){
    return shifts.filter(s=> (s.date||'').slice(0,7) === ym);
  }
  // 帳號的「稱呼」：用來顯示給人看的名字。
  // 打卡、時薪等資料一律還是以「帳號」當識別碼，稱呼只影響顯示，
  // 這樣之後改稱呼不會讓舊紀錄對不上人。
  function accountOf(username){
    return (settings.accounts||[]).find(a=>a.username===username) || null;
  }
  function displayNameOf(username){
    const acc = accountOf(username);
    const nick = acc && acc.displayName ? String(acc.displayName).trim() : '';
    return nick || username || '';
  }
  // 有設稱呼時顯示「稱呼（帳號）」，避免同名的人分不出來；有帳號的話，再補上角色（主管／櫃檯…）
  function staffLabel(username){
    const nick = displayNameOf(username);
    const acc = accountOf(username);
    const base = nick === username ? escHtml(username)
      : escHtml(nick) + '<span class="inline-note" style="margin-left:5px;">' + escHtml(username) + '</span>';
    const roleTag = acc && acc.role
      ? '<span class="inline-note" style="margin-left:5px;">（' + escHtml(roleLabel(acc.role)) + '）</span>'
      : '';
    return base + roleTag;
  }

  // 目前系統中出現過的員工名單（打卡紀錄 + 個別時薪設定 + 啟用中帳號），範圍較廣，
  // 用在「代打卡輸入」「新增個別時薪」這種需要打字建議、連歷史／已停用的人都想找到的地方。
  function staffPool(){
    const set = new Set();
    shifts.forEach(s=>{ if(s.staff) set.add(s.staff); });
    (settings.staffRates||[]).forEach(r=>{ if(r.name) set.add(r.name); });
    (settings.accounts||[]).forEach(a=>{ if(a.active && a.username) set.add(a.username); });
    return [...set].sort(compareNames);
  }
  // 只列出「目前啟用中的帳號」，跟系統設定的帳號管理清單完全一致。
  // 專門給「篩選員工」這種下拉選單用，不要混入舊打卡紀錄裡的歷史名字，
  // 不然選單會出現系統設定裡根本查不到、對不起來的名字，讓人以為抓到舊資料。
  function activeStaffNames(){
    return (settings.accounts||[]).filter(a=>a.active && a.username).map(a=>a.username).sort(compareNames);
  }

  function sortedRegions(){ return [...settings.regions].sort((a,b)=>a.order-b.order); }
  function regionFee(name){ const r = settings.regions.find(x=>x.name===name); return r? (Number(r.fee)||0) : 0; }

  // ===== 課程性質規則（v4.2：從「程式碼寫死」改成「讀資料」）=====
  // 每一種課程性質（classType 存的那個 key）現在對應 settings.courseTypes 裡的一筆資料，
  // 新增／停用課程都在系統設定的課程設定頁做，不用再改程式碼。
  // 常態課／試教課／個別課這三種內建類型的行為，透過 defaultCourseTypes() 的預設值原封不動保留。
  function courseTypeByKey(key){
    return (settings.courseTypes||[]).find(c=>c.key===key) || null;
  }
  // 目前啟用中的課程類型 key，依資料裡的順序（新增的排在後面）
  function activeCourseTypeKeys(){
    return (settings.courseTypes||[]).filter(c=>c.active).map(c=>c.key);
  }
  // 給前台登記用：啟用中，且今天日期落在起訖範圍內（沒設定起訖 = 常態課，永遠顯示）
  function selectableCourseTypes(dateStr){
    const d = dateStr || new Date().toISOString().slice(0,10);
    return (settings.courseTypes||[]).filter(c=>{
      if(!c.active) return false;
      if(c.startDate && d < c.startDate) return false;
      if(c.endDate && d > c.endDate) return false;
      return true;
    });
  }
  // 逐案報價型／尚未定案：金額由人工填寫，不套公式；人數只是紀錄用途
  function isManualPriced(key){
    const ct = courseTypeByKey(key);
    return !!ct && (ct.payModel==='quoted' || ct.payModel==='undecided');
  }

  function tierText(tiers){
    return [...tiers]
      .sort((a,b)=>a.min-b.min)
      .map(t=>'滿 ' + t.min + ' 人 +$' + t.amount.toLocaleString())
      .join('、');
  }
  function tierAmount(tiers, attendance){
    const a = Number(attendance)||0;
    const list = [...(tiers||[])].sort((x,y)=>y.min-x.min); // 由高到低比對，取符合的最高級距
    const t = list.find(x => a >= x.min);
    return t ? t.amount : 0;
  }
  function isNoShow(e){
    if(isManualPriced(e.classType)) return false;   // 逐案報價型沒有「無人到課」的概念
    return Number(e.attendance||0) === 0;
  }
  function baseFeeFor(e){
    const ct = courseTypeByKey(e.classType);
    if(!ct) return 0;   // 找不到對應的課程類型設定（可能被刪掉了），安全回傳 0，不要憑空生出金額
    if(ct.payModel==='quoted' || ct.payModel==='undecided') return Number(e.manualSalary)||0;
    if(ct.payModel==='tiered' || ct.payModel==='fixed'){
      return (Number(e.attendance)||0) >= 1 ? (Number(ct.baseFee)||0) : 0;
    }
    return 0;   // 包月／一期結算型尚未實作計薪邏輯，先不憑空給錢
  }
  function allowanceFor(e){
    const ct = courseTypeByKey(e.classType);
    if(!ct || ct.payModel!=='tiered') return 0;
    return tierAmount(ct.headcountTiers, e.attendance);
  }
  function targetBonusFor(e){
    const ct = courseTypeByKey(e.classType);
    if(!ct || ct.payModel!=='tiered') return 0;
    return tierAmount(ct.targetBonusTiers, e.attendance);
  }
  // 各處的總額計算沿用 bonusFor（加給 + 獎金），顯示時才拆成兩欄
  function bonusFor(e){ return allowanceFor(e) + targetBonusFor(e); }

  // ===== 車資／出勤補貼規則 =====
  const KAOHSIUNG_REGION = '高雄';       // 在地地區：平常不給車資
  const NO_SHOW_SUBSIDY = 100;            // 高雄老師整天無人到課時的出勤補貼
  // 報價已含車資的課程類型（例如個別課）不另計交通費
  function courseHasTransport(e){
    const ct = courseTypeByKey(e.classType);
    if(!ct) return false;
    return ct.transport !== 'included';
  }

  // 回傳每筆紀錄的交通給付金額 map（id -> 數字），
  // 另把每筆的顯示名稱（車資／出勤補貼）掛在 map 的隱藏屬性 _labels 上，
  // 這樣既相容原本「fees[id]||0」的用法，需要名稱時再查 _labels。
  function computeTransportFees(list){
    const groups = {};
    list.forEach(e=>{
      if(!courseHasTransport(e)) return;
      const key = e.teacher+'|'+e.date+'|'+e.region;
      (groups[key] = groups[key] || []).push(e);
    });

    const amount = {};
    const labels = {};
    list.forEach(e=>{ amount[e.id] = 0; });

    Object.values(groups).forEach(items=>{
      items.sort((a,b)=>{
        const ka = a.date+a.id, kb = b.date+b.id;
        return ka===kb ? 0 : (ka<kb ? -1 : 1);
      });
      const anchor = items[0];
      const region = anchor.region;
      const baseFee = regionFee(region);
      // 做法 B：當天有任何一堂無人到課，就算白跑
      const anyNoShow = items.some(x=> Number(x.attendance||0) === 0);

      if(region === KAOHSIUNG_REGION){
        if(anyNoShow){ amount[anchor.id] = NO_SHOW_SUBSIDY; labels[anchor.id] = '出勤補貼'; }
      } else if(baseFee > 0){
        amount[anchor.id] = baseFee;
        labels[anchor.id] = anyNoShow ? '出勤補貼' : '車資';
      }
    });
    Object.defineProperty(amount, '_labels', { value: labels, enumerable:false });
    return amount;
  }
  function feeLabel(fees, id){
    return (fees && fees._labels && fees._labels[id]) ? fees._labels[id] : '車資';
  }
  function monthEntries(ym){ return entries.filter(e=>e.date && e.date.slice(0,7)===ym); }

  // ===== 車資地區批次校正 =====
  // 把歷史登記紀錄的「出發地區」對齊每位老師「目前」的地區設定。
  // 分組鍵刻意跟 computeTransportFees 完全一致（老師｜日期｜地區），
  // 整組一起改，車資就不會因為當天被拆成兩組而重複計費。
  function computeRegionSyncPlan(fromYm, toYm){
    const teacherRegion = {};
    teachers.forEach(t=>{ teacherRegion[t.name] = t.region; });

    const inRange = entries.filter(e=>{
      if(!e.date) return false;
      const ym = e.date.slice(0,7);
      if(fromYm && ym < fromYm) return false;
      if(toYm && ym > toYm) return false;
      return true;
    });

    const groups = {};
    inRange.forEach(e=>{
      const key = e.teacher + '|' + e.date + '|' + e.region;
      if(!groups[key]) groups[key] = { teacher:e.teacher, date:e.date, from:e.region, items:[] };
      groups[key].items.push(e);
    });

    const changes = [];
    const unmatched = {};   // 找不到對應老師的（可能已刪除），不動它，只回報
    Object.keys(groups).sort().forEach(k=>{
      const g = groups[k];
      const target = teacherRegion[g.teacher];
      if(target === undefined){
        unmatched[g.teacher] = (unmatched[g.teacher]||0) + g.items.length;
        return;
      }
      if(target === g.from) return;   // 已經正確，不用動
      g.to = target;
      changes.push(g);
    });

    // 模擬套用後的車資，算出前後差額（完全不動到真正的 entries）
    const newRegionById = {};
    changes.forEach(g=> g.items.forEach(i=>{ newRegionById[i.id] = g.to; }));
    const before = computeTransportFees(inRange);
    const sim = inRange.map(e=> newRegionById[e.id]
      ? Object.assign({}, e, { region: newRegionById[e.id] })
      : e);
    const after = computeTransportFees(sim);

    let feeBefore = 0, feeAfter = 0, entryCount = 0;
    changes.forEach(g=>{
      g.feeBefore = g.items.reduce((s,i)=> s + (before[i.id]||0), 0);
      g.feeAfter  = g.items.reduce((s,i)=> s + (after[i.id]||0), 0);
      feeBefore += g.feeBefore;
      feeAfter  += g.feeAfter;
      entryCount += g.items.length;
    });

    return { changes, unmatched, feeBefore, feeAfter, entryCount,
             scanned: inRange.length, fromYm, toYm };
  }

    document.body.className = name;
    app.className = name;
  }

  function render(){
    const app = document.getElementById('app');
    if(!currentUser){
      applyTheme('theme-login');
      app.innerHTML = renderLogin();
      return;
    }
    applyTheme(mode==='owner' ? 'theme-owner' : 'theme-front');
    app.innerHTML = renderTopbar() + renderLoadWarningBanner() + ((mode==='owner' && canBackstage()) ? renderOwner() : renderFront());
    // 選單要固定貼在頂端列下方，但頂端列高度會因手機/電腦、使用者稱呼長短而略有不同，
    // 所以每次重繪都實際量一次，寫進 CSS 變數給 .tabs 的 sticky top 用，比寫死高度準確。
    const topbarEl = document.querySelector('.topbar');
    if(topbarEl) document.documentElement.style.setProperty('--topbar-h', topbarEl.offsetHeight + 'px');
    if(mode==='front' && frontTab==='daily' && editingId) hydrateEditForm();
    if(mode==='owner' && canBackstage() && ownerTab==='payroll') renderPayrollCharts();
  }

  function activeTeachers(){ return teachers.filter(t=>t.active); }
  function sortedTeacherNames(){ return activeTeachers().map(t=>t.name).sort(compareNames); }
  // 下拉選單排序：英文（A→Z）排在前面，中文接在後面依筆畫由少到多。
  // Intl 的 stroke collation 不是每個瀏覽器都支援，不支援時退回一般的中文排序。
  const strokeCollator = (function(){
    try{
      const c = new Intl.Collator('zh-Hant-u-co-stroke', { numeric:true });
      c.compare('一','丁');   // 觸發一次，確認不會拋錯
      return c;
    }catch(err){
      return new Intl.Collator('zh-Hant', { numeric:true });
    }
  })();
  function startsWithLatin(str){ return /^[A-Za-z]/.test(String(str||'').trim()); }
  function compareNames(a, b){
    const A = String(a||'').trim(), B = String(b||'').trim();
    const la = startsWithLatin(A), lb = startsWithLatin(B);
    if(la !== lb) return la ? -1 : 1;
    if(la){
      const x = A.toLowerCase(), y = B.toLowerCase();
      return x < y ? -1 : (x > y ? 1 : 0);
    }
    return strokeCollator.compare(A, B);
  }

  function compareShiftsDesc(a, b){
    if(a.date !== b.date) return a.date < b.date ? 1 : -1;
    const sa = a.start || '', sb = b.start || '';
    if(sa !== sb) return sa < sb ? 1 : -1;
    const ia = a.id || '', ib = b.id || '';
    if(ia === ib) return 0;
    return ia < ib ? 1 : -1;

  // 原本的比較器在日期相同時兩邊都回傳 -1，不是合法的比較函式，同一天的順序會飄。
  // 由舊到新：日期相同時再比 id（建立順序），同一天多堂課的排列才會固定。
  function compareEntriesAsc(a, b){ return -compareEntriesDesc(a, b); }
  function compareShiftsAsc(a, b){ return -compareShiftsDesc(a, b); }

  function compareEntriesDesc(a, b){
    if(a.date !== b.date) return a.date < b.date ? 1 : -1;
    const ia = a.id || '', ib = b.id || '';
    if(ia === ib) return 0;
    return ia < ib ? 1 : -1;
  }
  // 老師篩選同時比對「實際上課的人」與「原排定老師」，
  // 這樣查某位老師時，他被別人代掉的那幾堂也看得到。
  function entryMatchesTeacher(e, name){
    if(!name) return true;
    return e.teacher === name || e.originalTeacher === name;
  }
  function filteredEntries(){
    return entries
      .filter(e => !entryFilterDate || e.date === entryFilterDate)
      .filter(e => entryMatchesTeacher(e, entryFilterTeacher))
      .sort(compareEntriesDesc);
  }
  function entryTeacherOptions(){
    const set = new Set();
    entries.forEach(e=>{
      if(e.teacher) set.add(e.teacher);
      if(e.originalTeacher) set.add(e.originalTeacher);
    });
    return [...set].sort(compareNames);

  // 頁碼列：頁數多的時候只顯示目前頁附近，中間用 … 省略
  function pagerButtons(current, totalPages, handler){
    if(totalPages <= 1) return '';
    const pages = new Set([1, totalPages, current]);
    for(let d=1; d<=2; d++){
      if(current-d >= 1) pages.add(current-d);
      if(current+d <= totalPages) pages.add(current+d);
    }
    const sorted = [...pages].sort((a,b)=>a-b);
    let html = '';
    let prev = 0;
    sorted.forEach(n=>{
      if(prev && n - prev > 1) html += `<span style="padding:0 4px;color:var(--ink-soft);">…</span>`;
      html += `<button class="btn ${n===current?'':'outline'} small" style="min-width:34px;" onclick="${handler}(${n})">${n}</button>`;
      prev = n;
    });
    return html;
  }

  // 代課的兩種身分要分清楚：
  //   代課者（這筆鐘點算給他）→ 內師代課／外師代課
  //   原排定老師（他的班被別人上）→ 只在他自己的明細裡標「班被代」
  function subKindOf(e){
    if(!e.isSubstitute) return null;
    if(e.substituteKind) return e.substituteKind;
    // 舊資料沒有 substituteKind，就看代課者在不在教師清單裡
    return teachers.some(t=>t.name===e.teacher) ? 'internal' : 'external';
  }
  function subPill(e){
    const k = subKindOf(e);
    if(!k) return '';
    return k==='internal'
      ? `<span class="pill subin">內師代課</span>`
      : `<span class="pill subout">外師代課</span>`;
  }
  function paidPill(e){
    return e.paidOnSpot ? `<span class="pill muted">已即付</span>` : '';
  }
  function originLine(e){
    if(!e.isSubstitute || !e.originalTeacher) return '';
    return `<div class="inline-note" style="margin-top:2px;">↳ 原排定：${escHtml(e.originalTeacher)}</div>`;
  }

  function typePill(t){
    if(t==='group') return `<span class="pill group">常態課</span>`;
    if(t==='trial') return `<span class="pill trial">試教</span>`;
    return `<span class="pill individual">個別課</span>`;
  }
  function typeLabel(t){
    const ct = courseTypeByKey(t);
    return ct ? ct.label : (t || '');
  }

  // ===== 課程類別總表 =====
  // v4.2 起改成直接讀 settings.courseTypes，不再是寫死的清單——
  // 這裡只負責把資料組成「規則說明書」要顯示的文字，實際規則以資料本身為準。
  // payModel（計薪模式）：
  //   'tiered'    人數級距型（基本薪資 + 人數加給 + 達標獎金）
  //   'fixed'     固定單價型（不分人數，固定金額）
  //   'quoted'    逐案報價型（金額由人工逐筆輸入）
  //   'undecided' 尚未定案（比照逐案報價型，先手動輸入，之後隨時可切換成正式規則）
  //   'monthly'   包月／一期結算型（規劃中，尚未接入計薪邏輯）
  function courseCatalog(){
    return (settings.courseTypes||[]).map(ct=>{
      const rules = [];
      if(ct.payModel==='tiered'){
        rules.push('基本 $'+(Number(ct.baseFee)||0).toLocaleString()+'／堂');
        rules.push('人數加給：'+(ct.headcountTiers&&ct.headcountTiers.length ? tierText(ct.headcountTiers) : '未設定'));
        rules.push('達標獎金：'+(ct.targetBonusTiers&&ct.targetBonusTiers.length ? tierText(ct.targetBonusTiers) : '未設定'));
        rules.push('無人到課：不計堂費'+(ct.transport==='separate'?'，另補車馬費':''));
      } else if(ct.payModel==='fixed'){
        rules.push('固定 $'+(Number(ct.baseFee)||0).toLocaleString()+'／堂');
        rules.push('不分人數，無加給、無獎金');
      } else if(ct.payModel==='quoted'){
        rules.push('金額由老闆／系統管理者逐筆輸入');
        rules.push(ct.transport==='included' ? '報價已含車資' : '車資另計');
        rules.push('人數僅作紀錄用途');
      } else if(ct.payModel==='undecided'){
        rules.push('計薪規則尚未定案，目前比照逐案報價型手動輸入金額');
        rules.push('之後定案後，到課程設定切換計薪模式即可，不影響已登記的舊紀錄');
      } else if(ct.payModel==='monthly'){
        rules.push('包月／一期結算，細節尚未接入系統');
      }
      if(ct.startDate || ct.endDate){
        rules.push('期間限定：' + (ct.startDate||'不限') + ' ～ ' + (ct.endDate||'不限'));
      }
      return {
        key: ct.key, id: ct.id, label: ct.label, active: ct.active, payModel: ct.payModel,
        builtIn: !!ct.builtIn,
        transport: ct.transport==='included' ? '不另計（已含）' : '另計',
        startDate: ct.startDate, endDate: ct.endDate,
        rules
      };
    });
  }
  // 每種「計薪模式」一個代表色，卡片與下方說明共用，同一概念顏色一致
  const PAY_MODEL_LABEL = {
    tiered:'人數級距型', fixed:'固定單價型', quoted:'逐案報價型', undecided:'尚未定案', monthly:'包月／一期結算型'
  };
  const PAY_MODEL_TONE = {
    tiered:'tone-tiered', fixed:'tone-fixed', quoted:'tone-quoted', undecided:'tone-fixed', monthly:'tone-monthly'
  };

  function hydrateEditForm(){
    const e = entries.find(x=>x.id===editingId);
    if(!e){ editingId=null; return; }
    const dateEl = document.getElementById('f_date'); if(dateEl) dateEl.value = e.date;
    App.syncDayNote('f_date','f_dayNote');
    const teacherForDropdown = e.isSubstitute ? (e.originalTeacher || '') : e.teacher;
    const teacherEl = document.getElementById('f_teacher'); if(teacherEl) teacherEl.value = teacherForDropdown;
    App.onTeacherChange(teacherForDropdown);
    const courseSel = document.getElementById('f_course');
    courseSel.value = e.course;
    if(courseSel.value !== e.course){
      courseSel.value = '__manual__';
      App.onCourseChange('__manual__');
      const manualEl = document.getElementById('f_courseManual'); if(manualEl) manualEl.value = e.course;
    } else {
      App.onCourseChange(e.course);
    }
    const regionEl = document.getElementById('f_region'); if(regionEl) regionEl.value = e.region;
    const noteEl = document.getElementById('f_note'); if(noteEl) noteEl.value = e.note || '';
    const typeEl = document.getElementById('f_classType'); if(typeEl) typeEl.value = e.classType;
    App.onClassTypeChange(e.classType);
    // 人數欄現在三種課程都會顯示（含試教、個別課），所以一律帶回，不再只限常態課
    const attEl = document.getElementById('f_attendance');
    if(attEl) attEl.value = (e.attendance ?? '') === '' ? '' : e.attendance;
    const subChk = document.getElementById('f_isSubstitute');
    if(subChk){
      subChk.checked = !!e.isSubstitute;
      App.onSubstituteToggle(subChk.checked);
      if(e.isSubstitute){
        // 舊資料沒有 substituteKind，就依「代課者是否在教師清單中」自動判斷
        const inRoster = teachers.some(t=> t.name === e.teacher);
        const kind = e.substituteKind || (inRoster ? 'internal' : 'external');
        const radio = document.querySelector('input[name="f_subKind"][value="'+kind+'"]');
        if(radio) radio.checked = true;
        App.onSubKindChange(kind);
        if(kind==='internal'){
          const sel = document.getElementById('f_substituteSelect');
          if(sel){
            sel.value = e.teacher;
            // 若這位老師已被刪除或停用，退回外部模式並保留名字，避免資料看起來空白
            if(sel.value !== e.teacher){
              const ext = document.querySelector('input[name="f_subKind"][value="external"]');
              if(ext) ext.checked = true;
              App.onSubKindChange('external');
              const nameEl = document.getElementById('f_substituteName'); if(nameEl) nameEl.value = e.teacher;
            }
          }
        } else {
          const nameEl = document.getElementById('f_substituteName'); if(nameEl) nameEl.value = e.teacher;
        }
        const paidEl = document.getElementById('f_paidOnSpot'); if(paidEl) paidEl.checked = !!e.paidOnSpot;
      }
    }
  }

  // ---------- teacher config (now lives under front tabs) ----------
  function sortedTeachersForDisplay(){
    return [...teachers].sort((a,b)=>{
      if(a.active===b.active) return 0;
      return a.active ? -1 : 1;
    });
  }
  function renderTeacherConfig(){
    const displayTeachers = sortedTeachersForDisplay();
    // 只在第一次進入教師設定時自動展開第一位；使用者手動收合後不再自動彈開（避免收合時又跳一下）
    if(!teacherAutoExpandDone && expandedTeacherId===null && displayTeachers.length>0){
      expandedTeacherId = displayTeachers[0].id;
    }
    teacherAutoExpandDone = true;
    return `
      <h2 class="section-title">${icon('teacher')}教師設定</h2>
      <ul class="note-list">
        <li><strong>出發地區</strong>：老師從哪裡通勤到高雄，決定車資補助</li>
        <li><strong>提供課程</strong>：這位老師平常教的課程名稱</li>
        <li>資料預設<strong>鎖定</strong>，按名條上的「修改」才能編輯，避免手滑改到</li>
        <li>點名條可展開／收合，一次只展開一位；停用的老師會排到最下方</li>
      </ul>
      <div class="card">
        <div class="grid3">
          <div class="field"><label>老師姓名</label><input type="text" id="t_name" placeholder="例如：陳老師"/></div>
          <div class="field"><label>出發地區</label>
            <select id="t_region">${sortedRegions().map(r=>`<option value="${escAttr(r.name)}">${escHtml(r.name)}</option>`).join('')}</select>
          </div>
          <div class="field"><label>提供課程（可留空，之後再新增）</label><input type="text" id="t_course" placeholder="例如：爵士舞基礎班"/></div>
        </div>
        <button class="btn" onclick="App.addTeacher()">新增老師</button>
      </div>

      ${displayTeachers.length===0 ? `<div class="empty">尚未新增任何老師。</div>` : displayTeachers.map((t)=>{
        const isOpen = expandedTeacherId===t.id;
        const isEditing = editingTeacherId===t.id;
        const activeIdx = t.active ? displayTeachers.filter(x=>x.active).indexOf(t) : -1;
        // 啟用中的老師依序套用 5 色循環，色號跟名條上的編號對齊（1.→tone-1、2.→tone-2…）
        const toneNum = activeIdx >= 0 ? (activeIdx % 5) + 1 : 0;
        const tonedCls = toneNum ? ' teacher-toned' : '';
        const tonedVar = toneNum ? `--tint:var(--tone-${toneNum});` : '';
        return `
        <div class="card bar-card${tonedCls}" style="${tonedVar}">
          <div class="name-bar ${!t.active?'inactive':''}" style="cursor:pointer;" onclick="App.toggleTeacherExpand('${t.id}')">
            ${isEditing ? `
            <span class="name-bar-name" style="flex:1;min-width:0;" onclick="event.stopPropagation()">
              <input type="text" id="editname_${t.id}" value="${escAttr(t.name)}" class="name-edit-input"
                onkeydown="if(event.key==='Enter'){App.saveTeacherEdit('${t.id}')}else if(event.key==='Escape'){App.cancelTeacherEdit()}"/>
            </span>` : `
            <span class="name-bar-name">${t.active ? (activeIdx+1)+'. ' : ''}${escHtml(t.name)} ${!t.active?'<span class="pill muted">已停用</span>':''}</span>`}
            <div style="display:flex;gap:6px;align-items:center;" onclick="event.stopPropagation()">
              ${isEditing ? `
                <button class="btn outline small" style="border-color:var(--namebar-field-border);color:var(--namebar-ink);" onclick="App.saveTeacherEdit('${t.id}')">儲存</button>
                <button class="btn outline small" style="border-color:var(--namebar-field-border);color:var(--namebar-ink);" onclick="App.cancelTeacherEdit()">取消</button>
              ` : `
                <button class="btn outline small" style="border-color:var(--namebar-field-border);color:var(--namebar-ink);" onclick="App.startTeacherEdit('${t.id}')">修改</button>
                <button class="btn outline small" style="border-color:var(--namebar-field-border);color:var(--namebar-ink);" onclick="App.toggleTeacherActive('${t.id}')">${t.active?'停用':'啟用'}</button>
                <button class="btn danger small" onclick="App.deleteTeacher('${t.id}')">刪除</button>
                <span class="expand-caret" style="font-size:12px;color:var(--namebar-ink-soft);margin-left:2px;">${isOpen?'▲ 收合':'▼ 展開'}</span>
              `}
            </div>
          </div>
          ${isOpen ? `
          <div class="card-body teacher-body">
            <div class="info-block">
              <div class="info-label">出發地區</div>
              <div class="info-value-row">
                <select id="editregion_${t.id}" ${isEditing?'':'disabled'}>

              `}
            </div>
          </div>` : ''}
        </div>
      `;}).join('')}
    `;
  }

      ${ownerTab==='paidOnSpot' ? renderPaidOnSpotTab() : ''}
